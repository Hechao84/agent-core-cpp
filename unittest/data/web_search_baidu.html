  external URLs, not baidu.com/link?url= redirect hops); tracking IDs
  and personal tokens neutralized to SANITIZED.

  carries the external URL directly and the visible title text, with <em>
  wrappers around matched terms (StripTags handles those). Snippets
  live in JS-rendered molecules and are not parsed by the current parser
  — the agent uses web_fetcher on the URL for details.

  Tag delimiters in this comment are spelled out in prose so the parser
  regex does not accidentally match the documentation example as a real
  result.
-->
