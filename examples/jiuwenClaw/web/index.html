<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>jiuwenClaw Agent Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1e1e2e;
            --bg-secondary: #181825;
            --bg-tertiary: #313244;
            --text-primary: #cdd6f4;
            --text-secondary: #a6adc8;
            --accent: #89b4fa;
            --accent-hover: #74c7ec;
            --success: #a6e3a1;
            --warning: #f9e2af;
            --error: #f38ba8;
            --border: #45475a;
            --user-msg: #313244;
            --assistant-msg: #1e1e2e;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent);
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-small {
            padding: 4px 8px;
            font-size: 12px;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
        }

        .btn-ghost:hover {
            background: var(--bg-tertiary);
        }

        .btn-danger {
            background: var(--error);
            color: var(--bg-primary);
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .session-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 4px;
        }

        .session-item:hover {
            background: var(--bg-tertiary);
        }

        .session-item.active {
            background: var(--bg-tertiary);
            border: 1px solid var(--accent);
        }

        .session-item .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
        }

        .session-item .status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            margin-right: 8px;
        }

        .session-item .status.busy {
            background: var(--warning);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .session-item .delete-btn {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .session-item:hover .delete-btn {
            opacity: 1;
        }

        /* Main content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
        }

        .chat-header h2 {
            font-size: 16px;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg);
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--bg-tertiary);
            border-bottom-left-radius: 4px;
        }

        .message .role {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }

        .message .content {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message .content p {
            margin-bottom: 8px;
        }

        .message .content p:last-child {
            margin-bottom: 0;
        }

        .message .content code {
            background: var(--bg-primary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
        }

        .message .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            background: var(--bg-secondary);
            font-size: 13px;
        }

        .message .content th, .message .content td {
            border: 1px solid var(--border);
            padding: 6px 10px;
            text-align: left;
        }

        .message .content th {
            background: var(--bg-tertiary);
            font-weight: 600;
            color: var(--text-primary);
        }

        .message .content td {
            color: var(--text-secondary);
        }

        /* Smart Link Box */
        .smart-box {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 6px;
            padding: 10px;
            margin: 8px 0;
            max-width: 100%;
            transition: transform 0.1s;
            text-decoration: none;
            color: var(--text-primary);
        }

        .smart-box:hover {
            transform: scale(1.01);
            background: var(--bg-tertiary);
        }

        .smart-icon {
            width: 40px;
            height: 40px;
            background: var(--bg-tertiary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .smart-icon svg {
            width: 24px;
            height: 24px;
            fill: var(--accent);
        }

        .smart-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .smart-title {
            font-weight: 600;
            font-size: 14px;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .smart-url {
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message.tool-card {
            align-self: flex-start;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
            width: 90%;
            cursor: pointer;
            transition: background 0.2s;
        }

        .message.tool-card.collapsed {
            padding: 6px 10px;
        }

        .tool-summary {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .tool-summary .tool-icon {
            width: 18px;
            height: 18px;
            fill: var(--accent);
        }

        .message.tool-card:hover {
            background: rgba(255,255,255,0.02);
        }

        .tool-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--accent);
            font-size: 14px;
        }

        .tool-arrow {
            transition: transform 0.2s;
            font-size: 10px;
        }
        
        .tool-arrow.expanded {
            transform: rotate(90deg);
        }

        .tool-content {
            margin-top: 8px;
            background: var(--bg-primary);
            border-radius: 6px;
            padding: 10px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .tool-section-label {
            font-weight: bold;
            color: var(--text-secondary);
            margin: 8px 0 4px 0;
            font-size: 12px;
            display: block;
            border-bottom: 1px solid var(--border);
            padding-bottom: 2px;
        }
        
        .tool-section-label:first-child {
            margin-top: 0;
        }

        .message.status-msg {
            align-self: center;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-style: italic;
        }

        /* Input area */
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-wrapper textarea {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 120px;
            line-height: 1.5;
        }

        .input-wrapper textarea:focus {
            border-color: var(--accent);
        }

        .input-wrapper textarea::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: var(--accent-hover);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--bg-primary);
        }

        /* Cursor animation */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--accent);
            animation: blink 0.8s infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Welcome screen */
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px;
            text-align: center;
        }

        .welcome h2 {
            font-size: 32px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome p {
            color: var(--text-secondary);
            max-width: 500px;
            line-height: 1.6;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* Cancel button */
        .cancel-btn {
            position: absolute;
            bottom: 100px;
            right: 30px;
            background: var(--error);
            color: var(--bg-primary);
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: 500;
            display: none;
            z-index: 10;
        }

        .cancel-btn.visible {
            display: block;
        }

        .input-area {
            position: relative;
        }

        /* History modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.visible {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 12px;
            width: 80%;
            max-width: 800px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .history-entry {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .history-entry:last-child {
            border-bottom: none;
        }

        .history-entry .role {
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .history-entry .content {
            white-space: pre-wrap;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== Sidebar nav tabs + two-level lists ===== */
        .nav-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .nav-tab {
            flex: 1;
            padding: 12px 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }

        .nav-tab:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .nav-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .nav-view {
            flex: 1;
            overflow-y: auto;
            display: none;
        }

        .nav-view.active {
            display: block;
        }

        /* Section header (shown inside each view, e.g. "Sessions", "Feishu") */
        .nav-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .nav-group {
            margin-bottom: 4px;
        }

        .nav-group-header {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
            user-select: none;
            border-radius: 6px;
            margin: 0 4px;
        }

        .nav-group-header:hover {
            background: var(--bg-tertiary);
        }

        .nav-group-arrow {
            display: inline-block;
            width: 14px;
            transition: transform 0.15s;
            color: var(--text-secondary);
            font-size: 10px;
        }

        .nav-group.expanded .nav-group-arrow {
            transform: rotate(90deg);
        }

        .nav-group-title {
            flex: 1;
            font-weight: 600;
        }

        .nav-group-add {
            opacity: 0;
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: 16px;
            cursor: pointer;
            padding: 0 4px;
        }

        .nav-group-header:hover .nav-group-add {
            opacity: 1;
        }

        .nav-children {
            display: none;
            padding: 2px 0 4px 0;
        }

        .nav-group.expanded .nav-children {
            display: block;
        }

        .nav-child {
            display: flex;
            align-items: center;
            padding: 8px 12px 8px 32px;
            margin: 0 4px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            transition: background 0.15s, color 0.15s;
        }

        .nav-child:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .nav-child.active {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-left: 2px solid var(--accent);
            padding-left: 30px;
        }

        .nav-child .label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .nav-child .meta {
            font-size: 11px;
            color: var(--text-secondary);
            margin-left: 6px;
        }

        .nav-empty {
            padding: 10px 12px 10px 32px;
            font-size: 12px;
            color: var(--text-secondary);
            font-style: italic;
        }

        /* ===== Channel detail panel (right side) ===== */
        .channel-detail {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .channel-detail.active {
            display: flex;
        }

        .channel-detail-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .channel-detail-header h2 {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .channel-detail-header .sub {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .channel-detail-body {
            padding: 24px;
            max-width: 640px;
        }

        .channel-detail-body .field {
            margin-bottom: 16px;
        }

        .channel-detail-body .field label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .channel-detail-body .field input,
        .channel-detail-body .field textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }

        .channel-detail-body .field input:focus,
        .channel-detail-body .field textarea:focus {
            border-color: var(--accent);
        }

        .channel-detail-body .field .hint {
            margin-top: 4px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .channel-detail-actions {
            display: flex;
            gap: 8px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .btn-danger-solid {
            background: var(--error);
            color: #1e1e2e;
            font-weight: 600;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: filter 0.15s;
        }

        .btn-danger-solid:hover {
            filter: brightness(1.1);
        }

        .channel-detail-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .channel-status-pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            margin-left: 8px;
        }

        .channel-status-pill.enabled {
            background: rgba(166, 227, 161, 0.15);
            color: var(--success);
        }

        .channel-status-pill.disabled {
            background: rgba(243, 139, 168, 0.15);
            color: var(--error);
        }

        /* Input with a trailing toggle button (e.g. show/hide secret) */
        .input-with-toggle {
            position: relative;
        }

        .input-with-toggle input {
            padding-right: 56px;
        }

        .input-toggle-btn {
            position: absolute;
            top: 50%;
            right: 6px;
            transform: translateY(-50%);
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }

        .input-toggle-btn:hover {
            color: var(--text-primary);
            border-color: var(--accent);
            background: var(--bg-tertiary);
        }
    </style>

    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>jiuwenClaw</h1>
            </div>

            <div class="nav-tabs">
                <button class="nav-tab active" data-view="sessions" onclick="switchNavView('sessions')">Sessions</button>
                <button class="nav-tab" data-view="channels" onclick="switchNavView('channels')">Channels</button>
            </div>

            <!-- Sessions view -->
            <div class="nav-view active" id="navViewSessions">
                <div class="nav-section-header">
                    <span>Sessions</span>
                    <button class="btn btn-primary btn-small" onclick="createSession()">+ New</button>
                </div>
                <div class="session-list" id="sessionList"></div>
            </div>

            <!-- Channels view -->
            <div class="nav-view" id="navViewChannels">
                <div class="nav-section-header">
                    <span>Channels</span>
                </div>
                <div id="channelTree"></div>
            </div>
        </aside>

        <main class="main" id="mainArea">
            <div class="welcome" id="welcomeScreen">
                <h2>Welcome to jiuwenClaw</h2>
                <p>Select a session from the sidebar or create a new one to start chatting with the AI agent.</p>
            </div>

            <div class="chat-header" id="chatHeader" style="display: none;">
                <h2 id="currentSessionName"></h2>
                <div class="header-actions">
                    <button class="btn btn-ghost btn-small" onclick="clearChat()">Clear</button>
                </div>
            </div>

            <div class="messages" id="messages" style="display: none;"></div>

            <div class="input-area" id="inputArea" style="display: none;">
                <button class="cancel-btn" id="cancelBtn" onclick="cancelRequest()">Cancel</button>
                <div class="input-wrapper">
                    <textarea
                        id="messageInput"
                        placeholder="Type your message... (Enter to send, Shift+Enter for new line)"
                        rows="1"
                        onkeydown="handleKeyDown(event)"
                        oninput="autoResize(this)"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
            </div>

            <!-- Channel detail / editor panel -->
            <div class="channel-detail" id="channelDetail">
                <div class="channel-detail-header">
                    <h2 id="channelDetailTitle">Channel</h2>
                    <div class="sub" id="channelDetailSub"></div>
                </div>
                <div class="channel-detail-body" id="channelDetailBody"></div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = '';
        let sessions = [];
        let currentSessionId = null;
        const streamingSessions = new Set();
        let currentEventSource = null;
        let messages = {};

        async function fetchSessions() {
            try {
                const resp = await fetch(`${API_BASE}/api/sessions`);
                const data = await resp.json();
                sessions = data.sessions || [];
                console.log('[Debug] Fetched sessions from server:', sessions.length);
                renderSessions();
                return true;
            } catch (e) {
                console.error('[Error] Failed to fetch sessions:', e);
                return false;
            }
        }

        function renderSessions() {
            const list = document.getElementById('sessionList');
            list.innerHTML = '';

            sessions.forEach(session => {
                const item = document.createElement('div');
                item.className = `session-item${session.id === currentSessionId ? ' active' : ''}`;
                item.onclick = (e) => {
                    if (!e.target.classList.contains('delete-btn')) {
                        switchSession(session.id);
                    }
                };

                const statusClass = session.busy ? 'status busy' : 'status';
                const deleteBtn = session.id === '__DEFAULT__' ? '' :
                    `<button class="btn btn-ghost btn-small delete-btn" onclick="deleteSession('${session.id}')">x</button>`;

                item.innerHTML = `
                    <div class="${statusClass}"></div>
                    <span class="name">${escapeHtml(session.id)}</span>
                    ${deleteBtn}
                `;

                list.appendChild(item);
            });
        }

        async function createSession() {
            console.log("[Action] Create button clicked");
            try {
                // 1. 发起创建请求
                const resp = await fetch(`${API_BASE}/api/sessions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });

                if (!resp.ok) {
                    const errText = await resp.text();
                    throw new Error(`Server error ${resp.status}: ${errText}`);
                }

                const data = await resp.json();
                if (!data.id) {
                    throw new Error('Server did not return a Session ID');
                }

                console.log("[Success] Created session:", data.id);

                // 2. 先刷新列表，确保新 Session 出现在侧边栏
                await fetchSessions();

                // 3. 切换到新 Session
                switchSession(data.id);

            } catch (e) {
                console.error('Failed to create session:', e);
                alert('创建 Session 失败:\n' + e.message);
            }
        }

        async function deleteSession(sessionId) {
            if (sessionId === '__DEFAULT__') return;
            if (!confirm(`Delete session "${sessionId}"?`)) return;

            try {
                await fetch(`${API_BASE}/api/sessions/${sessionId}`, { method: 'DELETE' });
                if (currentSessionId === sessionId) {
                    currentSessionId = null;
                    localStorage.removeItem('jiuwen_session_id');
                }
                await fetchSessions();
                if (!currentSessionId) {
                    showWelcome();
                }
            } catch (e) {
                console.error('Failed to delete session:', e);
            }
        }

        function switchSession(sessionId) {
            console.log(`[Action] Switching to session: ${sessionId}`);
            currentSessionId = sessionId;
            localStorage.setItem('jiuwen_session_id', sessionId);

            // UI Reset: Ensure input state matches the new session's status
            const isSessionStreaming = streamingSessions.has(sessionId);
            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            if (input) input.disabled = isSessionStreaming;
            if (sendBtn) sendBtn.disabled = isSessionStreaming;
            if (cancelBtn) cancelBtn.classList.toggle('visible', isSessionStreaming);

            // 1. Check local cache for seamless resume (if refreshing page)
            const restored = restoreCachedStream(sessionId);
            
            // If restored, update messages array
            if (restored && (!messages[sessionId] || messages[sessionId].length === 0)) {
                messages[sessionId] = restored.messages;
            }
            
            // 2. Ensure the chat interface is shown and UI is updated
            showChat();
            renderSessions();
            
            // ALWAYS render messages to clear any old content from previous session
            // and show current session state (either restored cache or existing history)
            renderMessages();

            // 3. Load full history in background to refresh content if needed
            loadSessionHistory(sessionId).then(() => {
                checkSessionBusy(sessionId);
            }).catch(e => {
                console.warn("Failed to load history for session:", sessionId, e);
            });
        }

        function restoreCachedStream(sessionId) {
            const cached = sessionStorage.getItem(`jiuwen_stream_${sessionId}`);
            if (!cached) return null;

            try {
                const data = JSON.parse(cached);
                // Only restore if cache is relatively recent (last 5 mins)
                if (Date.now() - data.timestamp < 5 * 60 * 1000) {
                    return {
                        messages: [
                            { type: 'user', content: data.query, role: 'user' },
                            { type: 'assistant', content: data.content, role: 'assistant', isRestored: true }
                        ],
                        query: data.query
                    };
                }
            } catch (e) {}
            return null;
        }

        async function checkSessionBusy(sessionId) {
            try {
                const resp = await fetch(`${API_BASE}/api/sessions`);
                const data = await resp.json();
                const session = data.sessions.find(s => s.id === sessionId);
                
                // If we have a restored stream and session is NOT busy, 
                // it means the task finished while disconnected.
                // Force a full history reload to show the final result.
                if (session && !session.busy) {
                    const cached = sessionStorage.getItem(`jiuwen_stream_${sessionId}`);
                    if (cached) {
                        // Task is done on backend, replace restored stream with actual history
                        loadSessionHistory(sessionId);
                        cleanupStreamingStorage(sessionId);
                    }
                    streamingSessions.delete(sessionId); // Ensure removed from Set
                } 
                // If session IS busy, we show the stream (restored or current) 
                // and poll for completion.
                else if (session && session.busy) {
                    setStreaming(sessionId, true);
                    const poll = async () => {
                        try {
                            const pollResp = await fetch(`${API_BASE}/api/sessions`);
                            const pollData = await pollResp.json();
                            const pollSession = pollData.sessions.find(s => s.id === sessionId);
                            
                            if (!pollSession || !pollSession.busy) {
                                // Task finished, reload history to show the result
                                loadSessionHistory(sessionId);
                                cleanupStreamingStorage(sessionId);
                            }
                        } catch (e) {}
                        
                        // Always clear streaming state for this session after polling logic
                        setStreaming(sessionId, false);
                    };
                    // Start polling loop
                    const pollLoop = async () => {
                        try {
                            const pollResp = await fetch(`${API_BASE}/api/sessions`);
                            const pollData = await pollResp.json();
                            const pollSession = pollData.sessions.find(s => s.id === sessionId);
                            
                            if (!pollSession || !pollSession.busy) {
                                loadSessionHistory(sessionId);
                                cleanupStreamingStorage(sessionId);
                                setStreaming(sessionId, false); // Stop streaming UI
                            } else {
                                setTimeout(pollLoop, 2000);
                            }
                        } catch (e) {
                            setStreaming(sessionId, false);
                        }
                    };
                    setTimeout(pollLoop, 2000);
                } else {
                    // Session not found, clean up
                    cleanupStreamingStorage(sessionId);
                }
            } catch (e) {
                console.warn("Failed to check session busy state", e);
            }
        }

        function cleanupStreamingStorage(sessionId) {
            sessionStorage.removeItem(`jiuwen_stream_${sessionId}`);
            localStorage.removeItem(`jiuwen_streaming_query_${sessionId}`);
        }

        function showWelcome() {
            document.getElementById('welcomeScreen').style.display = 'flex';
            document.getElementById('chatHeader').style.display = 'none';
            document.getElementById('messages').style.display = 'none';
            document.getElementById('inputArea').style.display = 'none';
            document.getElementById('channelDetail').classList.remove('active');
        }

        function showChat() {
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('messages').style.display = 'flex';
            document.getElementById('inputArea').style.display = 'block';
            document.getElementById('channelDetail').classList.remove('active');
            document.getElementById('currentSessionName').textContent = currentSessionId;
        }

        function showChannelDetail() {
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('chatHeader').style.display = 'none';
            document.getElementById('messages').style.display = 'none';
            document.getElementById('inputArea').style.display = 'none';
            document.getElementById('channelDetail').classList.add('active');
        }

        function renderMessages(forceScrollToBottom = false) {
            const container = document.getElementById('messages');
            container.innerHTML = '';

            const msgList = messages[currentSessionId] || [];
            msgList.forEach((msg, idx) => {
                const div = document.createElement('div');
                let skip = false;
                
                if (msg.type === 'tool') {
                    div.className = 'message tool-card';
                    div.setAttribute('data-msg-index', idx);
                    const isExpanded = msg.expanded || false;
                    const arrowClass = isExpanded ? 'tool-arrow expanded' : 'tool-arrow';
                    const collapsedClass = isExpanded ? '' : ' collapsed';
                    div.className += collapsedClass;
                    
                    let html = `<div class="tool-header" onclick="toggleTool(${idx})">
                                    <span class="${arrowClass}">▶</span>
                                    <span>Tool: ${escapeHtml(msg.toolName)}</span>
                                </div>`;
                    
                    if (!isExpanded) {
                        const hasResult = msg.result && msg.result.length > 0;
                        html += `<div class="tool-summary">
                                    <svg class="tool-icon" viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
                                    <span>${hasResult ? 'Completed - click to view details' : 'Executing...'}</span>
                                 </div>`;
                    } else {
                        html += `<div class="tool-content">`;
                        if (msg.args) html += `<span class="tool-section-label">Arguments:</span><pre style="margin:0">${escapeHtml(msg.args)}</pre>`;
                        if (msg.result) html += `<span class="tool-section-label" style="margin-top:12px; color:var(--success)">Result:</span><div style="margin-top:4px">${escapeHtml(msg.result)}</div>`;
                        html += `</div>`;
                    }
                    div.innerHTML = html;

                } else if (msg.type === 'status') {
                    div.className = 'message status-msg';
                    div.setAttribute('data-msg-index', idx);
                    div.textContent = msg.content;

                } else {
                    let shouldRender = true;
                    if (msg.type === 'assistant' && msg.content) {
                        const trimmed = msg.content.trim();
                        if (trimmed.startsWith('{') && trimmed.endsWith('}')) {
                            try {
                                const parsed = JSON.parse(trimmed);
                                if (parsed.name && parsed.arguments !== undefined) {
                                    shouldRender = false;
                                }
                            } catch (e) {}
                        }
                    }

                    if (!shouldRender) {
                        skip = true;
                    } else {
                        div.className = `message ${msg.type}`;
                        div.setAttribute('data-msg-index', idx);
                        const roleLabel = msg.role === 'user' ? 'You' : (msg.isRestored ? 'Assistant (Recovering...)' : 'Assistant');
                        let contentHtml = formatContent(msg.content);
                        if (msg.isRestored && streamingSessions.has(currentSessionId)) {
                            contentHtml += '<span class="cursor"></span>';
                        }
                        div.innerHTML = `<div class="role">${roleLabel}</div><div class="content">${contentHtml}</div>`;
                    }
                }

                if (!skip) {
                    container.appendChild(div);
                }
            });

            if (forceScrollToBottom) {
                requestAnimationFrame(() => {
                    container.scrollTop = container.scrollHeight;
                });
            } else {
                smartScrollToBottom(container);
            }
        }

        function smartScrollToBottom(container) {
            requestAnimationFrame(() => {
                const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 50;
                if (isAtBottom) {
                    container.scrollTop = container.scrollHeight;
                }
            });
        }

        function appendAssistantMessage(sessionId, content, query) {
            if (!messages[sessionId]) {
                messages[sessionId] = [];
            }
            const list = messages[sessionId];
            const lastMsg = list.length > 0 ? list[list.length - 1] : null;
            
            if (lastMsg && lastMsg.type === 'assistant') {
                lastMsg.content += content;
                if (sessionId === currentSessionId) {
                    incrementalUpdateAssistant(sessionId);
                }
            } else {
                list.push({
                    type: 'assistant',
                    content: content,
                    role: 'assistant'
                });
                if (sessionId === currentSessionId) {
                    incrementalAppendAssistant(sessionId);
                }
            }
            
            const assistantMsg = list[list.length - 1];
            if (assistantMsg && assistantMsg.type === 'assistant') {
                sessionStorage.setItem(
                    `jiuwen_stream_${sessionId}`, 
                    JSON.stringify({ content: assistantMsg.content, timestamp: Date.now(), query: query })
                );
            }
        }

        function incrementalAppendAssistant(sessionId) {
            const container = document.getElementById('messages');
            const msgList = messages[sessionId];
            const lastMsg = msgList[msgList.length - 1];
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.setAttribute('data-msg-index', msgList.length - 1);
            div.innerHTML = `<div class="role">Assistant</div><div class="content">${formatContent(lastMsg.content)}</div>`;
            container.appendChild(div);
            smartScrollToBottom(container);
        }

        function incrementalUpdateAssistant(sessionId) {
            const container = document.getElementById('messages');
            const msgList = messages[sessionId];
            const lastAssistantIndex = findLastMessageIndex(sessionId, 'assistant');
            if (lastAssistantIndex === -1) return;
            
            const contentDiv = container.querySelector(`.message.assistant[data-msg-index="${lastAssistantIndex}"] .content`);
            if (contentDiv) {
                contentDiv.innerHTML = formatContent(msgList[lastAssistantIndex].content);
                smartScrollToBottom(container);
            }
        }

        function findLastMessageIndex(sessionId, type) {
            const list = messages[sessionId];
            for (let i = list.length - 1; i >= 0; i--) {
                if (list[i].type === type) {
                    return i;
                }
            }
            return -1;
        }

        function appendToolMessage(sessionId, toolName, args) {
            if (!messages[sessionId]) {
                messages[sessionId] = [];
            }
            const newIndex = messages[sessionId].length;
            messages[sessionId].push({
                type: 'tool',
                content: '',
                toolName: toolName,
                args: args,
                expanded: false
            });
            if (sessionId === currentSessionId) {
                incrementalAppendTool(sessionId, newIndex);
            }
        }

        function incrementalAppendTool(sessionId, index) {
            const container = document.getElementById('messages');
            const msg = messages[sessionId][index];
            const div = document.createElement('div');
            div.className = 'message tool-card';
            div.setAttribute('data-msg-index', index);
            div.innerHTML = `<div class="tool-header" onclick="toggleTool(${index})">
                                <span class="tool-arrow">▶</span>
                                <span>Tool: ${escapeHtml(msg.toolName)}</span>
                             </div>
                             <div class="tool-summary">
                                <svg class="tool-icon" viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
                                <span>Executing...</span>
                             </div>`;
            container.appendChild(div);
            smartScrollToBottom(container);
        }

        function appendStatusMessage(sessionId, content) {
            if (!messages[sessionId]) {
                messages[sessionId] = [];
            }
            const list = messages[sessionId];
            const lastMsg = list.length > 0 ? list[list.length - 1] : null;
            
            if (lastMsg && lastMsg.type === 'status') {
                lastMsg.content += ' ' + content;
                if (sessionId === currentSessionId) {
                    incrementalUpdateStatus(sessionId);
                }
            } else {
                list.push({
                    type: 'status',
                    content: content
                });
                if (sessionId === currentSessionId) {
                    incrementalAppendStatus(sessionId);
                }
            }
        }

        function incrementalAppendStatus(sessionId) {
            const container = document.getElementById('messages');
            const msgList = messages[sessionId];
            const lastMsg = msgList[msgList.length - 1];
            const div = document.createElement('div');
            div.className = 'message status-msg';
            div.setAttribute('data-msg-index', msgList.length - 1);
            div.textContent = lastMsg.content;
            container.appendChild(div);
            smartScrollToBottom(container);
        }

        function incrementalUpdateStatus(sessionId) {
            const container = document.getElementById('messages');
            const msgList = messages[sessionId];
            const lastStatusIndex = findLastMessageIndex(sessionId, 'status');
            if (lastStatusIndex === -1) return;
            
            const statusDiv = container.querySelector(`.message.status-msg[data-msg-index="${lastStatusIndex}"]`);
            if (statusDiv) {
                statusDiv.textContent = msgList[lastStatusIndex].content;
                smartScrollToBottom(container);
            }
        }

        function toggleTool(index) {
            const list = messages[currentSessionId];
            if (list && list[index]) {
                list[index].expanded = !list[index].expanded;
                renderMessages();
            }
        }

        function setStreaming(sessionId, streaming) {
            if (streaming) {
                streamingSessions.add(sessionId);
            } else {
                streamingSessions.delete(sessionId);
            }

            // Update UI ONLY if the affected session is the one currently being viewed
            if (sessionId === currentSessionId) {
                document.getElementById('sendBtn').disabled = streaming;
                document.getElementById('cancelBtn').classList.toggle('visible', streaming);
                document.getElementById('messageInput').disabled = streaming;
            }
        }

        function addMessage(type, content, options = {}) {
            const targetSessionId = options.sessionId || currentSessionId;
            if (!targetSessionId) return;
            if (!messages[targetSessionId]) {
                messages[targetSessionId] = [];
            }

            messages[targetSessionId].push({
                type,
                content,
                role: options.role || 'assistant',
                toolName: options.toolName || '',
                args: options.args || '',
                expanded: false
            });

            // Only render if the message belongs to the currently active session view
            if (targetSessionId === currentSessionId) {
                renderMessages();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !currentSessionId || streamingSessions.has(currentSessionId)) return;

            const sessionId = currentSessionId;
            input.value = '';
            input.style.height = 'auto';

            showChat();
            addMessage('user', text, { role: 'user', sessionId: sessionId });
            setStreaming(sessionId, true);
            localStorage.setItem(`jiuwen_streaming_query_${sessionId}`, text);

            try {
                await streamChat(text, sessionId);
            } catch (e) {
                console.error('Chat error:', e);
            } finally {
                setStreaming(sessionId, false);
                loadSessionHistory(sessionId);
                cleanupStreamingStorage(sessionId);
            }
        }

        async function streamChat(message, sessionId) {
            return new Promise((resolve, reject) => {
                fetch(`${API_BASE}/api/chat/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, message: message })
                }).then(async response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    setStreaming(sessionId, true);
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    let receivedDone = false;

                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) {
                            break;
                        }

                        buffer += decoder.decode(value, { stream: true });
                        const events = buffer.split('\n\n');
                        buffer = events.pop();

                        for (const evt of events) {
                            if (!evt.trim()) continue;

                            let eventType = 'message';
                            let eventData = '';
                            const lines = evt.split('\n');
                            let hasData = false;

                            for (const line of lines) {
                                if (line.startsWith('event: ')) {
                                    eventType = line.slice(7);
                                } else if (line.startsWith('data: ')) {
                                    if (hasData) {
                                        eventData += '\n';
                                    }
                                    eventData += line.slice(6);
                                    hasData = true;
                                }
                            }

                            const msgList = messages[sessionId];

                            if (eventType === 'stream') {
                                if (!eventData) continue;
                                
                                if (eventData.trim().startsWith('{')) {
                                    try {
                                        const parsed = JSON.parse(eventData);
                                        if (parsed.name && (parsed.arguments !== undefined)) {
                                            appendToolMessage(sessionId, parsed.name, typeof parsed.arguments === 'string' ? parsed.arguments : JSON.stringify(parsed.arguments));
                                            continue;
                                        }
                                    } catch (e) {
                                    }
                                }

                                appendAssistantMessage(sessionId, eventData, message);
                            } else if (eventType === 'status') {
                                appendStatusMessage(sessionId, eventData);
                            } else if (eventType === 'tool_call') {
                                try {
                                    const data = JSON.parse(eventData);
                                    const toolName = data.name || 'tool';
                                    appendToolMessage(sessionId, toolName, typeof data.arguments === 'object' ? JSON.stringify(data.arguments) : (data.arguments || JSON.stringify(data)));
                                } catch {
                                    appendToolMessage(sessionId, 'Unknown Tool', eventData);
                                }
                            } else if (eventType === 'tool_response') {
                                updateLastToolMsg(eventData, sessionId);
                            } else if (eventType === 'done') {
                                receivedDone = true;
                                try {
                                    const res = JSON.parse(eventData);
                                    if (!res.success && res.error) {
                                        appendStatusMessage(sessionId, `Error: ${res.error}`);
                                    }
                                } catch (e) {}
                            }
                        }
                    }
                    
                    if (!receivedDone) {
                         console.warn('Stream ended without a "done" event');
                    }
                    resolve();
                }).catch(err => {
                    if (err.name !== 'AbortError') {
                        console.error('Stream catch:', err);
                    }
                    reject(err);
                }).finally(() => {
                    setStreaming(sessionId, false);
                    if (reader) {
                        reader.releaseLock();
                    }
                });
            });
        }

        async function cancelRequest() {
            if (currentSessionId && streamingSessions.has(currentSessionId)) {
                try {
                    await fetch(`${API_BASE}/api/sessions/${currentSessionId}/cancel`, {
                        method: 'POST'
                    });
                } catch (e) {
                    console.error('Cancel error:', e);
                }
            }
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        function clearChat() {
            if (currentSessionId) {
                // Only clear frontend view, history is persisted
                messages[currentSessionId] = [];
                renderMessages();
            }
        }

        // Removed old modal functions

        async function loadSessionHistory(sessionId) {
            if (!sessionId) return;

            try {
                const resp = await fetch(`${API_BASE}/api/sessions/${sessionId}/history`);
                const data = await resp.json();

                if (!data.messages || data.messages.length === 0) {
                    messages[sessionId] = [];
                    renderMessages();
                    return;
                }

                const tempMessages = [];

                data.messages.forEach(msg => {
                    const role = msg.role;
                    const content = msg.content || '';

                    if (role === 'user') {
                        tempMessages.push({ type: 'user', content, role: 'user' });
                    } else if (role === 'tool' || role === 'tool_response') {
                        let resultContent = content;
                        if (resultContent.startsWith('[TOOL_RESPONSE]')) {
                            resultContent = resultContent.replace('[TOOL_RESPONSE]', '').trim();
                        }

                        let matched = false;
                        for (let i = tempMessages.length - 1; i >= 0; i--) {
                            if (tempMessages[i].type === 'tool' && !tempMessages[i].result) {
                                tempMessages[i].result = resultContent;
                                matched = true;
                                break;
                            }
                        }
                        // 如果匹配失败（例如 LLM 重复调用导致前端 UI 去重，但后端存了多条 response）
                        // 尝试从历史记录中继承最近的 Tool Name，而不是显示 Unknown Tool
                        if (!matched) {
                            let fallbackName = 'Unknown Tool';
                            for (let i = tempMessages.length - 1; i >= 0; i--) {
                                if (tempMessages[i].type === 'tool' && tempMessages[i].toolName && tempMessages[i].toolName !== 'Unknown Tool') {
                                    fallbackName = tempMessages[i].toolName;
                                    break;
                                }
                            }
                            tempMessages.push({
                                type: 'tool',
                                toolName: fallbackName,
                                args: '',
                                result: resultContent,
                                expanded: false
                            });
                        }
                    } else {
                        let isToolCall = false;
                        let parsedTool = null;
                        if (content.trim().startsWith('{')) {
                            try {
                                const parsed = JSON.parse(content.trim());
                                if (parsed.name && (parsed.arguments !== undefined || parsed.input !== undefined)) {
                                    isToolCall = true;
                                    parsedTool = {
                                        type: 'tool',
                                        toolName: parsed.name,
                                        args: parsed.arguments !== undefined ? (typeof parsed.arguments === 'string' ? parsed.arguments : JSON.stringify(parsed.arguments)) : (typeof parsed.input === 'string' ? parsed.input : JSON.stringify(parsed.input)),
                                        result: '',
                                        expanded: false
                                    };
                                }
                            } catch (e) {}
                        }

                        if (isToolCall && parsedTool) {
                            tempMessages.push(parsedTool);
                        } else if (!isToolCall) {
                            tempMessages.push({ type: 'assistant', content, role: 'assistant' });
                        }
                    }
                });

                messages[sessionId] = tempMessages;
                renderMessages(true);
            } catch (e) {
                console.error('Failed to load history:', e);
            }
        }

        function updateLastToolMsg(resultContent, sessionId) {
            const msgList = messages[sessionId];
            if (!msgList) return;
            for (let i = msgList.length - 1; i >= 0; i--) {
                if (msgList[i].type === 'tool') {
                    msgList[i].result = resultContent;
                    if (sessionId === currentSessionId) {
                        incrementalUpdateTool(sessionId, i);
                    }
                    break;
                }
            }
        }

        function incrementalUpdateTool(sessionId, index) {
            const container = document.getElementById('messages');
            const msg = messages[sessionId][index];
            const toolDiv = container.querySelector(`.message.tool-card[data-msg-index="${index}"]`);
            if (toolDiv) {
                const summary = toolDiv.querySelector('.tool-summary');
                if (summary) {
                    summary.innerHTML = `<svg class="tool-icon" viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
                                <span>Completed - click to view details</span>`;
                }
                smartScrollToBottom(container);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatContent(text) {
            if (!text) return '';
            
            // 1. Normalize CRLF
            text = text.replace(/\r\n/g, '\n');
            
            // 2. Extract Code Blocks to protect them
            const codeBlocks = [];
            text = text.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
                const index = codeBlocks.length;
                const escapedCode = escapeHtml(code).replace(/\n/g, '<br>');
                codeBlocks.push(`<pre><code class="language-${lang || ''}">${escapedCode}</code></pre>`);
                return `__JIUWEN_CODE_BLOCK_${index}__`;
            });

            // 3. Escape HTML for safety
            text = escapeHtml(text);

            // 4. Parse Tables and Line-by-Line formatting
            const lines = text.split('\n');
            let outputParts = [];
            let i = 0;

            while (i < lines.length) {
                let line = lines[i];
                let trimmed = line.trim();

                // Placeholder check
                if (trimmed.startsWith('__JIUWEN_CODE_BLOCK_') && trimmed.endsWith('__')) {
                    outputParts.push(trimmed);
                    i++;
                    continue;
                }

                // Table Check
                const isRowLike = /^\s*\|/.test(trimmed) && trimmed.includes('|');
                let isTable = false;
                if (isRowLike && i + 1 < lines.length) {
                    const nextTrimmed = lines[i + 1].trim();
                    // Separator line like |---|
                    if (/^\s*\|[\s\-\|:]+\|\s*$/.test(nextTrimmed)) {
                        isTable = true;
                    }
                }

                if (isTable) {
                    let tableHtml = '<table>';
                    // Header
                    tableHtml += '<thead><tr>' + parseMdRow(trimmed, 'th') + '</tr></thead>';
                    tableHtml += '<tbody>';
                    // Skip header and separator
                    i += 2;
                    
                    // Body
                    while (i < lines.length) {
                        let bodyLine = lines[i];
                        let bodyTrimmed = bodyLine.trim();
                        if (/^\s*\|/.test(bodyTrimmed) && bodyTrimmed.includes('|')) {
                            tableHtml += '<tr>' + parseMdRow(bodyTrimmed, 'td') + '</tr>';
                            i++;
                        } else {
                            break;
                        }
                    }
                    tableHtml += '</tbody></table>';
                    outputParts.push(tableHtml);
                } else {
                    // Non-table line: process links and inline markdown
                    let formattedLine = parseMarkdownLinks(trimmed);
                    formattedLine = formattedLine.replace(/`([^`]+)`/g, '<code>$1</code>');
                    formattedLine = formattedLine.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                    formattedLine = formattedLine.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                    outputParts.push(formattedLine);
                    i++;
                }
            }

            let finalHtml = outputParts.join('<br>');
            // Restore Code Blocks
            finalHtml = finalHtml.replace(/__JIUWEN_CODE_BLOCK_(\d+)__/g, function(m, idx) {
                return codeBlocks[parseInt(idx)];
            });

            return finalHtml;
        }

        function parseMdRow(line, tag) {
            if (line.startsWith('|')) line = line.substring(1);
            if (line.endsWith('|')) line = line.substring(0, line.length - 1);
            const cells = line.split('|');
            return cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('');
        }

        function parseMarkdownLinks(text) {
            // Smart Links (http)
            text = text.replace(/(https?:\/\/[^\s<>\[\]{}]+)/g, function(url) {
                try {
                    if (url.includes('amap.com') || url.includes('gaode.com')) {
                        const icon = `<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>`;
                        return `<a href="${url}" target="_blank" class="smart-box"><div class="smart-icon">${icon}</div><div class="smart-info"><span class="smart-title">查看地图位置</span><span class="smart-url">amap map</span></div></a>`;
                    } else {
                        const icon = `<svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>`;
                        let hostname = url;
                        try { hostname = new URL(url).hostname; } catch(e){}
                        return `<a href="${url}" target="_blank" class="smart-box"><div class="smart-icon">${icon}</div><div class="smart-info"><span class="smart-title">访问链接</span><span class="smart-url">${hostname}</span></div></a>`;
                    }
                } catch (e) { return url; }
            });

            // Markdown Links [text](url)
            text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(match, linkText, url) {
                try {
                    if (url.includes('amap') || url.includes('gaode') || url.startsWith('amapuri://')) {
                        const icon = `<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>`;
                        return `<a href="${url}" target="_blank" class="smart-box"><div class="smart-icon">${icon}</div><div class="smart-info"><span class="smart-title">${linkText}</span><span class="smart-url">amap map</span></div></a>`;
                    } else {
                        let hostname = url;
                        try { hostname = new URL(url).hostname; } catch(e){}
                        return `<a href="${url}" target="_blank" class="smart-box"><div class="smart-icon">🔗</div><div class="smart-info"><span class="smart-title">${linkText}</span><span class="smart-url">${hostname}</span></div></a>`;
                    }
                } catch (e) { return match; }
            });
            return text;
        }

        function formatJsonSafe(str) {
            try {
                const obj = typeof str === 'string' ? JSON.parse(str) : str;
                return escapeHtml(JSON.stringify(obj, null, 2));
            } catch {
                return escapeHtml(str);
            }
        }

        // Health check
        async function checkHealth() {
            try {
                const resp = await fetch(`${API_BASE}/api/health`);
                if (resp.ok) {
                    const data = await resp.json();
                    console.log('Health check:', data);
                }
            } catch (e) {
                console.warn('Health check failed:', e);
            }
        }

        // Expose functions to window for onclick handlers
        window.createSession = createSession;
        window.deleteSession = deleteSession;
        window.sendMessage = sendMessage;
        window.cancelRequest = cancelRequest;
        window.clearChat = clearChat;
        window.switchSession = switchSession;
        window.toggleTool = toggleTool;

        // ==================== Channels ====================
        // Channel types supported on the frontend. Backend currently only
        // implements 'feishu'; others will be added later.
        const CHANNEL_TYPES = [
            { key: 'feishu', label: 'Feishu' },
        ];

        // type -> expanded(bool) for the sidebar tree groups.
        const channelGroupState = { feishu: true };

        // Currently selected channel id (string) or pseudo-id 'new:<type>' for
        // an unsaved draft. null when nothing is shown in detail panel.
        let selectedChannelId = null;

        // In-memory cache of channels last fetched from the backend.
        let channelsCache = [];

        async function fetchChannels() {
            try {
                const resp = await fetch(`${API_BASE}/api/channels`);
                if (!resp.ok) return [];
                const data = await resp.json();
                return Array.isArray(data) ? data : [];
            } catch (e) {
                console.error('Failed to fetch channels:', e);
                return [];
            }
        }

        async function createChannel(type, name, params) {
            const resp = await fetch(`${API_BASE}/api/channels`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type, name, enabled: true, params })
            });
            if (!resp.ok) return null;
            try {
                return await resp.json();
            } catch (e) {
                return {};
            }
        }

        async function updateChannel(id, payload) {
            const resp = await fetch(`${API_BASE}/api/channels/${encodeURIComponent(id)}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            return resp.ok;
        }

        async function deleteChannel(id) {
            const resp = await fetch(`${API_BASE}/api/channels/${encodeURIComponent(id)}`, {
                method: 'DELETE'
            });
            return resp.ok;
        }

        function switchNavView(view) {
            document.querySelectorAll('.nav-tab').forEach(t => {
                t.classList.toggle('active', t.dataset.view === view);
            });
            document.querySelectorAll('.nav-view').forEach(v => {
                v.classList.toggle('active', v.id === `navView${view.charAt(0).toUpperCase()}${view.slice(1)}`);
            });
            if (view === 'channels') {
                refreshChannelTree();
                if (!selectedChannelId) {
                    showChannelEmpty();
                }
            } else {
                // Switching back to sessions view restores chat or welcome.
                if (currentSessionId) {
                    showChat();
                } else {
                    showWelcome();
                }
            }
        }

        async function refreshChannelTree() {
            channelsCache = await fetchChannels();
            const tree = document.getElementById('channelTree');
            tree.innerHTML = '';

            for (const t of CHANNEL_TYPES) {
                const instances = channelsCache.filter(c => c.type === t.key);
                const expanded = !!channelGroupState[t.key];

                const group = document.createElement('div');
                group.className = `nav-group${expanded ? ' expanded' : ''}`;

                const header = document.createElement('div');
                header.className = 'nav-group-header';
                header.innerHTML = `
                    <span class="nav-group-arrow">▶</span>
                    <span class="nav-group-title">${escapeHtml(t.label)}</span>
                    <span class="meta" style="font-size:11px;color:var(--text-secondary);margin-right:4px">${instances.length}</span>
                    <button class="nav-group-add" title="Add ${escapeHtml(t.label)} channel">+</button>
                `;
                header.querySelector('.nav-group-add').onclick = (e) => {
                    e.stopPropagation();
                    channelGroupState[t.key] = true;
                    startNewChannel(t.key);
                };
                header.onclick = () => {
                    channelGroupState[t.key] = !channelGroupState[t.key];
                    refreshChannelTree();
                };

                const children = document.createElement('div');
                children.className = 'nav-children';

                if (!instances.length) {
                    const empty = document.createElement('div');
                    empty.className = 'nav-empty';
                    empty.textContent = 'No channels yet';
                    children.appendChild(empty);
                } else {
                    for (const ch of instances) {
                        const item = document.createElement('div');
                        item.className = `nav-child${selectedChannelId === ch.id ? ' active' : ''}`;
                        item.innerHTML = `
                            <span class="label">${escapeHtml(ch.name || ch.id)}</span>
                            <span class="meta">${ch.enabled ? '' : 'off'}</span>
                        `;
                        item.onclick = () => selectChannel(ch.id);
                        children.appendChild(item);
                    }
                }

                group.appendChild(header);
                group.appendChild(children);
                tree.appendChild(group);
            }
        }

        function selectChannel(id) {
            selectedChannelId = id;
            const ch = channelsCache.find(c => c.id === id);
            refreshChannelTree();
            showChannelDetail();
            if (ch) {
                renderChannelEditor(ch);
            } else {
                showChannelEmpty('Channel not found.');
            }
        }

        function startNewChannel(type) {
            selectedChannelId = `new:${type}`;
            refreshChannelTree();
            showChannelDetail();
            renderChannelEditor({ type, _isNew: true });
        }

        function showChannelEmpty(message) {
            document.getElementById('channelDetailTitle').textContent = 'Channels';
            document.getElementById('channelDetailSub').textContent = '';
            const body = document.getElementById('channelDetailBody');
            body.innerHTML = `
                <div class="channel-detail-empty">
                    ${escapeHtml(message || 'Select a channel from the left, or click + to add a new one.')}
                </div>
            `;
        }

        function renderChannelEditor(ch) {
            const isNew = !!ch._isNew;
            const type = ch.type || 'feishu';
            const params = ch.params || {};

            document.getElementById('channelDetailTitle').textContent =
                isNew ? `New ${capitalize(type)} Channel` : (ch.name || ch.id);
            document.getElementById('channelDetailSub').innerHTML = isNew
                ? `Type: <b>${escapeHtml(type)}</b>`
                : `ID: <code>${escapeHtml(ch.id)}</code> · Type: <b>${escapeHtml(type)}</b>` +
                  (ch.enabled
                      ? '<span class="channel-status-pill enabled">enabled</span>'
                      : '<span class="channel-status-pill disabled">disabled</span>');

            const body = document.getElementById('channelDetailBody');

            if (type === 'feishu') {
                body.innerHTML = `
                    <div class="field">
                        <label>Name</label>
                        <input id="chName" value="${escapeHtml(ch.name || '')}" placeholder="My Bot">
                    </div>
                    <div class="field">
                        <label>App ID *</label>
