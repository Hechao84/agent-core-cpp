<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>jiuwenClaw</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  /* Light theme — mirrors jiuwenswarm */
  --bg:#f5f7f9; --card:#ffffff; --panel:#ffffff;
  --bg-elevated:#ffffff; --bg-hover:#f0f0f0; --bg-muted:#f0f0f0;
  --secondary:#f4f4f5;
  --text:#3f3f46; --text-strong:#18181b; --muted:#71717a;
  --border:#e4e4e7; --border-strong:#d4d4d8; --border-hover:#a1a1aa;
  --input:#e4e4e7;
  --accent:#2563eb; --accent-hover:#3b82f6;
  --accent-subtle:rgba(37,99,235,.12);
  --accent-foreground:#ffffff;
  --accent-2:#0d9488;
  --ok:#16a34a; --warn:#d97706; --danger:#dc2626; --info:#2563eb;
  --ok-subtle:rgba(22,163,74,.1); --warn-subtle:rgba(217,119,6,.1); --danger-subtle:rgba(220,38,38,.1);
  --border-accent:rgba(37,99,235,.4);
  --border-ok:rgba(22,163,74,.35); --border-danger:rgba(220,38,38,.35);
  --ring:#2563eb;

  --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 12px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04);
  --shadow-lg:0 12px 28px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.04);

  --font-body:"HarmonyOS Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace;
  --font-size-base:14px; --font-size-sm:13px; --font-size-xs:12px; --font-size-2xs:11px;
  --shell-pad:16px; --shell-gap:16px; --shell-nav-width:240px;
}

html, body { height:100%; }
body{
  font-family:var(--font-body); font-size:var(--font-size-base); font-weight:400;
  line-height:1.55; letter-spacing:-0.02em;
  color:var(--text); background:var(--bg);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  height:100vh; overflow:hidden;
}
.mono{ font-family:var(--mono); font-feature-settings:"liga" 0; }

/* ---------- App shell ---------- */
.shell{
  display:grid;
  grid-template-columns: var(--shell-nav-width) 1fr;
  grid-template-areas:"nav content";
  height:100vh; gap:var(--shell-gap); padding:var(--shell-pad);
}
.nav  { grid-area:nav;     min-width:0; }
.content { grid-area:content; min-width:0; min-height:0; display:flex; flex-direction:column; }

/* ---------- Sidebar (Pixso spec) ---------- */
.sidebar{
  height:100%;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  display:flex; flex-direction:column;
  overflow:hidden;
}
.sidebar-header{
  display:flex; align-items:center; gap:10px;
  padding:14px 16px 12px;
}
.brand{
  width:28px; height:28px; border-radius:8px;
  background:linear-gradient(135deg,#449AFF 0%,#1478FF 50.15%,#3589FF 100%);
  color:#fff; display:inline-flex; align-items:center; justify-content:center;
  font-weight:700; font-size:14px; flex-shrink:0;
  box-shadow:0 2px 6px rgba(20,120,255,.25);
}
.brand-text{ font-weight:600; color:var(--text-strong); font-size:14px; }

.nav-section-label{
  padding:14px 16px 6px;
  font-size:12px; color:#777; font-weight:500;
}
.nav-section-label:first-of-type{ padding-top:4px; }

.nav-list{
  display:flex; flex-direction:column;
}
.nav-item{
  height:32px; margin:0 8px; padding:0 8px;
  display:flex; align-items:center; gap:10px;
  border-radius:8px;
  font-size:14px; font-weight:400; color:#191919;
  background:transparent; border:none; cursor:pointer;
  transition:background .15s ease, color .15s ease;
  text-align:left; user-select:none;
}
.nav-item:hover{ background:#F5F5F5; }
.nav-item.active{ background:#EAEAEB; font-weight:600; color:#000; }
.nav-item .ico{
  width:16px; height:16px; flex-shrink:0; color:#5b5b62;
  display:inline-flex; align-items:center; justify-content:center;
}
.nav-item .ico svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.nav-item.active .ico{ color:#000; }
.nav-item .label{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nav-item .meta{ font-size:11px; color:#9a9aa3; font-family:var(--mono); }

.sidebar-spacer{ flex:1; }
.sidebar-bottom{
  border-top:1px solid var(--border);
  padding:12px 16px;
  font-size:12px; color:var(--muted);
  display:flex; align-items:center; justify-content:space-between;
}

/* ---------- Main content card ---------- */
.card{
  background:var(--card);
  border-radius:var(--radius-lg);
  border:1px solid var(--border);
  padding:20px;
  height:100%;
  display:flex; flex-direction:column;
  min-height:0;
  box-shadow:var(--shadow-sm);
}
.card-header{
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:16px; margin-bottom:16px; flex-shrink:0;
}
.card-header h2{
  font-size:18px; font-weight:600; color:var(--text-strong);
}
.card-header .sub{
  font-size:13px; color:var(--muted); margin-top:4px;
}
.card-header-actions{ display:flex; align-items:center; gap:8px; }
.card-body{
  flex:1; min-height:0; overflow:auto;
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:1px solid var(--border);
  background:var(--bg-elevated);
  color:var(--text);
  padding:9px 16px;
  border-radius:8px;
  font-size:13px; font-weight:500;
  letter-spacing:-0.01em;
  cursor:pointer;
  transition:transform .12s cubic-bezier(.16,1,.3,1), background .12s, border-color .12s, box-shadow .12s;
  font-family:inherit; user-select:none;
}
.btn:hover{
  background:var(--bg-hover);
  border-color:var(--border-strong);
  transform:translateY(-1px);
  box-shadow:var(--shadow-sm);
}
.btn:active{ transform:translateY(0); box-shadow:none; background:var(--secondary); }
.btn:disabled{ opacity:.5; pointer-events:none; transform:none; box-shadow:none; }
.btn.primary{
  background:var(--accent); color:var(--accent-foreground);
  border-color:var(--accent);
  box-shadow:0 1px 2px rgba(0,0,0,.1);
}
.btn.primary:hover{ background:var(--accent-hover); border-color:var(--accent-hover); }
.btn.danger{
  background:var(--danger); color:#fff; border-color:var(--danger);
}
.btn.danger:hover{ background:#b91c1c; border-color:#b91c1c; }
.btn.ghost{
  background:transparent; border-color:transparent; color:var(--muted);
}
.btn.ghost:hover{ background:var(--secondary); color:var(--text); border-color:transparent; }
.btn.sm{ padding:6px 12px; font-size:12px; }
.btn.xs{ padding:3px 8px; font-size:11px; border-radius:6px; }

.icon-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:28px; height:28px; padding:0;
  background:transparent; border:1px solid var(--border);
  border-radius:6px; color:var(--muted); cursor:pointer;
  transition:all .15s;
}
.icon-btn:hover{ color:var(--danger); border-color:var(--danger); background:var(--danger-subtle); }
.icon-btn svg{ width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.7; }

/* ---------- Sub-tabs (underline style) ---------- */
.subtabs{ display:flex; border-bottom:1px solid var(--border); margin-bottom:16px; flex-shrink:0; }
.subtabs .tab{
  padding:10px 16px; font-size:13px; font-weight:500;
  color:var(--muted); background:transparent; border:none;
  border-bottom:2px solid transparent; cursor:pointer;
  transition:color .15s, border-color .15s;
  font-family:inherit;
}
.subtabs .tab:hover{ color:var(--text); }
.subtabs .tab.active{ color:var(--accent); border-bottom-color:var(--accent); }

/* ---------- Group-card (collapsible section with colored icon) ---------- */
.group-card{
  border:1px solid var(--border);
  background:rgba(255,255,255,.7);
  border-radius:var(--radius-xl);
  overflow:hidden;
  box-shadow:var(--shadow-sm);
  margin-bottom:12px;
}
.group-card-header{
  width:100%; display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px;
  background:rgba(244,244,245,.5);
  border:none; cursor:pointer;
  font-family:inherit; color:var(--text);
  transition:background .15s;
}
.group-card-header:hover{ background:rgba(244,244,245,.8); }
.group-card-header .left{ display:flex; align-items:center; gap:12px; min-width:0; }
.group-card-header .tile{
  width:28px; height:28px; flex-shrink:0;
  border-radius:7px;
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid;
}
.group-card-header .tile.t-blue   { color:#2563eb; background:rgba(37,99,235,.1); border-color:rgba(37,99,235,.2); }
.group-card-header .tile.t-purple { color:#7c3aed; background:rgba(124,58,237,.1); border-color:rgba(124,58,237,.2); }
.group-card-header .tile.t-pink   { color:#ec4899; background:rgba(236,72,153,.1); border-color:rgba(236,72,153,.2); }
.group-card-header .tile.t-amber  { color:#d97706; background:rgba(217,119,6,.1); border-color:rgba(217,119,6,.2); }
.group-card-header .tile.t-green  { color:#16a34a; background:rgba(22,163,74,.1); border-color:rgba(22,163,74,.2); }
.group-card-header .tile svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.group-card-header .titles{ min-width:0; text-align:left; }
.group-card-header .title{ font-size:14px; font-weight:500; color:var(--text-strong); display:block; }
.group-card-header .hint{ font-size:12px; color:var(--muted); display:block; }
.group-card-header .right{ display:flex; align-items:center; gap:10px; color:var(--muted); flex-shrink:0; }
.group-card-header .chip{
  font-size:11px; padding:2px 8px; border-radius:9999px;
  border:1px solid var(--border); background:var(--secondary);
}
.group-card-header .chev{
  width:14px; height:14px; transition:transform .2s;
  stroke:currentColor; fill:none; stroke-width:2;
}
.group-card.open .chev{ transform:rotate(180deg); }
.group-card-body{
  border-top:1px solid var(--border);
  padding:14px 16px;
  display:none;
}
.group-card.open .group-card-body{ display:block; }

/* ---------- Form fields ---------- */
.field{ margin-bottom:12px; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:500; }
.field input[type=text], .field input[type=number], .field input[type=password],
.field textarea, .field select{
  width:100%; padding:8px 12px;
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:6px; font-size:13px;
  color:var(--text); font-family:inherit;
  outline:none; transition:border-color .15s, box-shadow .15s;
}
.field input:focus, .field textarea:focus, .field select:focus{
  border-color:var(--ring);
  box-shadow:0 0 0 3px var(--accent-subtle);
}
.field .hint{ margin-top:4px; font-size:11px; color:var(--muted); }
.field input:disabled{ background:var(--secondary); color:var(--muted); cursor:not-allowed; }

.checkbox-field{ display:flex; align-items:center; gap:8px; }
.checkbox-field input[type=checkbox]{ width:auto; cursor:pointer; }
.checkbox-field label{ margin:0; cursor:pointer; }

.input-with-toggle{ display:flex; gap:6px; align-items:stretch; }
.input-with-toggle input{ flex:1; }
.input-with-toggle .toggle{
  padding:0 12px; font-size:12px; border:1px solid var(--border);
  background:var(--bg-elevated); border-radius:6px; cursor:pointer;
  color:var(--muted); font-family:inherit;
}
.input-with-toggle .toggle:hover{ color:var(--accent); border-color:var(--accent); }

/* Key-value table */
.kv-table{ width:100%; border-collapse:collapse; font-size:13px; }
.kv-table th{
  text-align:left; padding:6px 8px;
  font-size:11px; font-weight:600; color:var(--muted);
  text-transform:uppercase; letter-spacing:0.5px;
}
.kv-table td{ padding:6px 4px; vertical-align:middle; }
.kv-table input, .kv-table select{
  width:100%; padding:6px 10px;
  background:var(--bg-elevated); border:1px solid var(--border);
  border-radius:6px; font-size:13px; color:var(--text); font-family:inherit; outline:none;
}
.kv-table input:focus, .kv-table select:focus{ border-color:var(--accent); }
.kv-table .col-action{ width:36px; text-align:right; }
.kv-table .empty-row td{ color:var(--muted); padding:10px 4px; font-style:italic; font-size:12px; }

/* Add-row dashed button */
.add-row{
  width:100%; padding:8px;
  border:1px dashed var(--border); border-radius:8px;
  background:transparent; color:var(--muted); font-size:12px;
  cursor:pointer; transition:all .15s; font-family:inherit;
  margin-top:8px;
}
.add-row:hover{ color:var(--accent); border-color:var(--accent); background:rgba(37,99,235,.04); }

/* ---------- Status pills / chips ---------- */
.pill{
  display:inline-flex; align-items:center; gap:6px;
  padding:2px 8px; border-radius:9999px;
  font-size:11px; font-weight:500;
  border:1px solid var(--border); background:var(--secondary); color:var(--muted);
}
.pill.ok{ color:var(--ok); background:var(--ok-subtle); border-color:var(--border-ok); }
.pill.warn{ color:var(--warn); background:var(--warn-subtle); border-color:rgba(217,119,6,.35); }
.pill.danger{ color:var(--danger); background:var(--danger-subtle); border-color:var(--border-danger); }
.pill.accent{ color:var(--accent); background:var(--accent-subtle); border-color:var(--border-accent); }

/* Tool pill list */
.tools-pills{ display:flex; flex-wrap:wrap; gap:6px; }
.tools-pills .tool-pill{
  padding:4px 10px; border-radius:9999px;
  border:1px solid var(--border); background:var(--bg-elevated);
  font-size:12px; color:var(--text); cursor:pointer;
  transition:all .15s; user-select:none;
}
.tools-pills .tool-pill:hover{ border-color:var(--accent); color:var(--accent); }
.tools-pills .tool-pill.selected{
  background:var(--accent); color:var(--accent-foreground); border-color:var(--accent);
}

/* Status banner */
.status-banner{
  padding:10px 14px; border-radius:8px; font-size:13px;
  border:1px solid; margin-bottom:14px;
}
.status-banner.ok{ background:var(--ok-subtle); border-color:var(--border-ok); color:var(--ok); }
.status-banner.err{ background:var(--danger-subtle); border-color:var(--border-danger); color:var(--danger); }
.status-banner.info{ background:var(--accent-subtle); border-color:var(--border-accent); color:var(--accent); }

/* Empty state */
.empty-state{
  height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  color:var(--muted); font-size:13px; padding:40px 20px; text-align:center;
}
.empty-state svg{ width:48px; height:48px; opacity:.4; margin-bottom:12px; stroke:currentColor; fill:none; stroke-width:1.5; }
.empty-state .title{ font-size:14px; color:var(--text); margin-bottom:6px; }

/* Form actions row */
.form-actions{
  display:flex; align-items:center; gap:8px;
  margin-top:20px; padding-top:16px;
  border-top:1px solid var(--border);
}
.form-status{ font-size:12px; color:var(--muted); margin-left:auto; }
.form-status.ok{ color:var(--ok); }
.form-status.err{ color:var(--danger); }

/* ---------- List items (used in Channels/Agents sub-list) ---------- */
.list-row{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  width:100%; padding:10px 12px;
  border:1px solid var(--border); border-radius:10px;
  background:var(--bg-elevated); text-align:left; cursor:pointer;
  margin-bottom:8px; transition:all .15s;
  font-family:inherit;
}
.list-row:hover{ background:var(--secondary); border-color:var(--border-strong); }
.list-row.active{ background:var(--accent-subtle); border-color:var(--border-accent); }
.list-row .lr-main{ display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
.list-row .lr-id{ font-family:var(--mono); font-size:11px; color:var(--muted); padding:1px 6px; border:1px solid var(--border); border-radius:4px; background:var(--secondary); flex-shrink:0; }
.list-row .lr-title{ font-size:13px; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.list-row .lr-sub{ font-size:11px; color:var(--muted); }

/* Status dot (used in MCP server list to show connection state) */
.status-dot{
  display:inline-block; width:8px; height:8px; border-radius:50%;
  flex-shrink:0; margin-right:6px;
}
.status-dot.connected{ background:#16a34a; box-shadow:0 0 0 2px rgba(22,163,74,.2); }
.status-dot.disconnected{ background:#dc2626; box-shadow:0 0 0 2px rgba(220,38,38,.2); }
.status-dot.disabled{ background:#a1a1aa; }

/* Key-value editor rows (used by MCP headers/env) */
.kv-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:6px; }
.kv-row{ display:grid; grid-template-columns:1fr 1fr auto; gap:6px; align-items:center; }
.kv-row input{ font-size:12px; padding:6px 8px; border:1px solid var(--border); border-radius:6px; background:var(--bg-elevated); color:var(--text); font-family:inherit; }
.kv-row input:focus{ outline:none; border-color:var(--accent); }
.kv-empty{ font-size:11px; color:var(--muted); padding:6px 0; }

/* Ask-user interactive bubble */
.ask-user{ background:var(--bg-elevated); border:1px solid var(--accent); border-radius:10px; padding:12px 16px; }
.ask-user .role{ font-size:12px; font-weight:600; color:var(--accent); margin-bottom:6px; }
.ask-question{ font-size:14px; color:var(--text); margin-bottom:10px; }
.ask-options{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.ask-options .btn{ border-color:var(--accent); color:var(--accent); }
.ask-options .btn:hover{ background:var(--accent); color:#fff; }
.ask-free{ display:flex; gap:6px; align-items:center; }
.ask-free input{ flex:1; font-size:12px; padding:6px 8px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font-family:inherit; }
.ask-free input:focus{ outline:none; border-color:var(--accent); }
.ask-answered{ font-size:12px; color:var(--muted); font-style:italic; }

/* Two-pane layout for editors */
.two-pane{
  flex:1; min-height:0;
  display:grid; grid-template-columns:minmax(0,3fr) minmax(0,7fr);
  gap:14px;
}
.pane{
  border:1px solid var(--border); border-radius:var(--radius-lg);
  background:rgba(255,255,255,.7); overflow:hidden;
  display:flex; flex-direction:column; min-height:0;
}
.pane-header{
  padding:12px 14px;
  background:rgba(244,244,245,.5);
  border-bottom:1px solid var(--border);
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:8px; flex-shrink:0;
}
.pane-header h3{ font-size:13px; font-weight:500; color:var(--text); }
.pane-header .sub{ font-size:11px; color:var(--muted); margin-top:2px; font-family:var(--mono); }
.pane-body{ padding:14px; flex:1; min-height:0; overflow:auto; }

/* ---------- Chat ---------- */
.chat-wrap{ flex:1; display:flex; flex-direction:column; min-height:0; gap:0; }
.chat-messages{
  flex:1; min-height:0; overflow:auto;
  padding:16px 24px; display:flex; flex-direction:column; gap:14px;
}
.chat-bubble{
  max-width:78%; padding:10px 14px; border-radius:var(--radius-lg);
  font-size:14px; line-height:1.55; word-break:break-word;
  border:1px solid transparent;
}
.chat-bubble.user{ align-self:flex-end; background:var(--accent-subtle); border-color:var(--border-accent); color:var(--text-strong); }
.chat-bubble.assistant{ align-self:flex-start; background:var(--bg-muted); border-color:var(--border); }
.chat-bubble .role{ font-size:11px; font-weight:600; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px; }
.chat-bubble pre{
  margin:6px 0; padding:10px 12px;
  background:var(--bg); border:1px solid var(--border); border-radius:6px;
  font-family:var(--mono); font-size:12px; overflow:auto;
}
.chat-bubble code{ font-family:var(--mono); font-size:12px; background:var(--bg); padding:1px 4px; border-radius:3px; }
.chat-bubble.tool{
  background:rgba(244,244,245,.6); border:1px solid var(--border); align-self:flex-start;
  max-width:78%; padding:0;
}
.chat-bubble.tool .tool-head{
  display:flex; align-items:center; gap:8px;
  padding:8px 12px;
  font-size:12px; color:var(--text); cursor:pointer;
  user-select:none;
}
.chat-bubble.tool .tool-name{ font-weight:600; color:var(--text-strong); }
.chat-bubble.tool .tool-args{
  flex:1; min-width:0;
  color:var(--muted); font-size:11px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.chat-bubble.tool .tool-status{
  font-size:11px; padding:1px 7px; border-radius:9999px;
  border:1px solid var(--border); background:var(--bg-elevated);
}
.chat-bubble.tool .tool-status.running{
  color:var(--warn); background:var(--warn-subtle); border-color:rgba(217,119,6,.35);
}
.chat-bubble.tool .tool-status.done{
  color:var(--ok); background:var(--ok-subtle); border-color:var(--border-ok);
}
.chat-bubble.tool .tool-body{
  display:none;
  border-top:1px solid var(--border);
  padding:10px 12px;
}
.chat-bubble.tool.open .tool-body{ display:block; }
.chat-bubble.tool.open .arrow{ transform:rotate(90deg); }
.chat-bubble.tool .arrow{ transition:transform .2s; display:inline-block; color:var(--muted); }
.chat-bubble.tool .tool-sub-label{
  font-size:10px; font-weight:600; color:var(--muted);
  text-transform:uppercase; letter-spacing:.5px;
  margin:8px 0 4px;
}
.chat-bubble.tool .tool-sub-label:first-child{ margin-top:0; }
.chat-bubble.tool pre{
  margin:0;
  background:var(--bg); border:1px solid var(--border); border-radius:6px;
  padding:8px 10px;
  font-family:var(--mono); font-size:12px;
  max-height:260px; overflow:auto;
  white-space:pre-wrap; word-break:break-word;
}
.chat-bubble.status{
  background:transparent; border:none; align-self:center;
  color:var(--muted); font-size:11px; padding:2px 10px;
  max-width:100%;
}
.chat-bubble.status.k-iter{
  background:var(--accent-subtle); color:var(--accent); border:1px solid var(--border-accent);
  border-radius:9999px; font-weight:500; padding:3px 10px;
}
.chat-bubble.status.warn{
  color:var(--warn); background:var(--warn-subtle); border:1px solid rgba(217,119,6,.28);
  border-radius:9999px; padding:3px 10px;
}
.chat-bubble.status.err{
  color:var(--danger); background:var(--danger-subtle); border:1px solid var(--border-danger);
  border-radius:9999px; padding:3px 10px;
}

.chat-input-area{
  padding:14px 24px 18px; border-top:1px solid var(--border);
  background:var(--card); flex-shrink:0;
}
.chat-input-row{
  display:flex; align-items:flex-end; gap:8px;
  border:1px solid var(--border); border-radius:12px;
  padding:8px 8px 8px 14px;
  background:var(--bg-elevated);
  transition:border-color .15s, box-shadow .15s;
}
.chat-input-row:focus-within{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-subtle); }
.chat-input-row textarea{
  flex:1; resize:none; border:none; outline:none;
  background:transparent; font-family:inherit; font-size:14px;
  color:var(--text); line-height:1.5;
  max-height:200px; min-height:24px;
  padding:6px 0;
}
.chat-input-row .send-btn{
  width:36px; height:36px; border-radius:10px;
  background:var(--accent); color:#fff; border:none; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
  transition:background .15s, transform .12s;
}
.chat-input-row .send-btn:hover{ background:var(--accent-hover); }
.chat-input-row .send-btn:disabled{ background:var(--muted); cursor:not-allowed; }
.chat-input-row .send-btn svg{ width:16px; height:16px; fill:#fff; }

/* Status bar (chat) */
.statusbar{
  display:flex; align-items:center; justify-content:center; gap:10px;
  padding:10px 16px; border-top:1px solid var(--border);
  background:var(--card); font-size:12px; color:var(--muted);
}
.statusbar .processing{
  display:inline-flex; align-items:center; gap:6px;
  color:var(--warn); padding:4px 10px; border-radius:9999px;
  background:var(--warn-subtle); border:1px solid rgba(217,119,6,.28);
  font-weight:600;
}
.statusbar .processing .dot{
  width:6px; height:6px; border-radius:50%; background:var(--warn);
  box-shadow:0 0 8px var(--warn);
  animation:pulse 1s infinite;
}
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.4} }

/* Sessions list specific */
.session-row{
  display:grid; grid-template-columns:1fr auto; gap:6px; align-items:center;
  margin-bottom:4px;
}
.session-row .main{
  text-align:left; padding:8px 12px; border-radius:8px;
  border:1px solid transparent; background:transparent;
  font-size:13px; color:var(--text); cursor:pointer; font-family:inherit;
  display:flex; flex-direction:column; gap:2px; min-width:0;
}
.session-row .main:hover{ background:var(--secondary); }
.session-row.active .main{ background:var(--accent-subtle); border-color:var(--border-accent); color:var(--text-strong); }
.session-row .main .name{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.session-row .main .sub{ font-size:11px; color:var(--muted); }
.session-row .del{
  opacity:0; width:26px; height:26px; padding:0;
  background:transparent; border:none; cursor:pointer;
  border-radius:6px; color:var(--muted); display:flex; align-items:center; justify-content:center;
}
.session-row .del:hover{ color:var(--danger); background:var(--danger-subtle); }
.session-row:hover .del{ opacity:1; }
.session-row .del svg{ width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.7; }

/* Misc */
.spacer{ flex:1; }
.hidden{ display:none !important; }
.scroll-y{ overflow-y:auto; }

/* ---------- Skill list ---------- */
.skill-card{
  display:flex; gap:12px; align-items:flex-start;
  padding:12px;
  border:1px solid var(--border); border-radius:10px;
  background:var(--bg-elevated); cursor:pointer;
  margin-bottom:8px; transition:all .15s;
}
.skill-card:hover{ background:var(--secondary); border-color:var(--border-strong); }
.skill-card.active{ background:var(--accent-subtle); border-color:var(--border-accent); }
.skill-avatar{
  width:40px; height:40px; flex-shrink:0;
  border-radius:8px;
  display:inline-flex; align-items:center; justify-content:center;
  color:#fff; font-weight:600; font-size:18px;
  text-transform:uppercase;
}
.skill-meta{ flex:1; min-width:0; }
.skill-name{ font-size:14px; font-weight:600; color:var(--text-strong); margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.skill-desc{
  font-size:12px; color:var(--muted); line-height:1.5;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden;
}
.skill-detail-body pre{
  margin-top:8px;
  background:var(--bg); padding:12px; border-radius:6px;
  font-family:var(--mono); font-size:12px;
  line-height:1.55;
  white-space:pre-wrap; word-break:break-word;
  max-height:60vh; overflow:auto;
  border:1px solid var(--border);
}
.skill-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }

</style>
</head>

<script>
"use strict";

// ============================================================
//  State
// ============================================================
const API_BASE = '';
let sessions = [];
let currentSessionId = null;
let messages = {};
const streamingSessions = new Set();
let currentEventSource = null;
let lastStreamCancel = null;

let agentsCache = [];
let availableToolsCache = [];
let selectedAgentId = null;
let currentAgentDraft = null;

let channelsCache = [];
let selectedChannelId = null;

let mcpServersCache = [];
let selectedMcpServerId = null;

let skillsCache = [];
let skillsRootDir = '';
let selectedSkillId = null;

const RESERVED_SESSION_IDS = new Set(['__heartbeat__', '__cron__']);

// ============================================================
//  Utils
// ============================================================
function $(id){ return document.getElementById(id); }
function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function setStatus(text){
  const el = $('bottomStatus'); if (el) el.textContent = text;
}

// ============================================================
//  Navigation between views
// ============================================================
function switchView(view){
  document.querySelectorAll('.nav-item').forEach(b => {
    if (b.dataset && b.dataset.view) b.classList.toggle('active', b.dataset.view === view);
  });
  document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
  $('view' + view.charAt(0).toUpperCase() + view.slice(1)).classList.remove('hidden');
  if (view === 'agents'){ refreshAgentList(); if (!selectedAgentId) showAgentEmpty(); }
  if (view === 'skills'){ refreshSkillList(); if (!selectedSkillId) showSkillEmpty(); }
  if (view === 'channels'){ refreshChannelTree(); if (!selectedChannelId) showChannelEmpty(); }
  if (view === 'mcpServers'){ refreshMcpList(); if (!selectedMcpServerId) showMcpEmpty(); }
}

// ============================================================
//  Sessions
// ============================================================
async function fetchSessions(){
  try{
    const r = await fetch(`${API_BASE}/api/sessions`);
    const j = await r.json();
    sessions = (j.sessions || []).filter(s => !RESERVED_SESSION_IDS.has(s.id));
    renderSessions();
    return true;
  } catch(e){ console.error(e); return false; }
}

function renderSessions(){
  const list = $('sessionList');
  list.innerHTML = '';
  $('sessionsCount').textContent = `${sessions.length} active`;
  $('navSessionsCount').textContent = sessions.length ? sessions.length : '';
  sessions.forEach(s => {
    const row = document.createElement('div');
    row.className = `session-row${s.id === currentSessionId ? ' active' : ''}`;
    row.innerHTML = `
      <button class="main" onclick="switchSession('${s.id.replace(/'/g,"\\'")}')">
        <span class="name">${escapeHtml(s.id)}</span>
        ${s.busy ? '<span class="sub">running…</span>' : ''}
      </button>
      <button class="del" title="删除会话" onclick="deleteSession('${s.id.replace(/'/g,"\\'")}')">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>
      </button>
    `;
    list.appendChild(row);
  });
  if (!sessions.length){
    list.innerHTML = `<div class="empty-state"><div class="title">暂无会话</div><div>点击侧边栏「新建会话」开始</div></div>`;
  }
}

async function createSession(){
  switchView('sessions');
  const id = 'session_' + Date.now().toString(36);
  try{
    const r = await fetch(`${API_BASE}/api/sessions`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id })
    });
    if (r.ok){ await fetchSessions(); switchSession(id); }
  } catch(e){ console.error(e); }
}

async function deleteSession(id){
  if (!confirm(`删除会话 ${id}?`)) return;
  try{
    await fetch(`${API_BASE}/api/sessions/${encodeURIComponent(id)}`, { method:'DELETE' });
    if (currentSessionId === id) currentSessionId = null;
    delete messages[id];
    await fetchSessions();
    renderMessages();
    updateChatHeader();
  } catch(e){ console.error(e); }
}

function switchSession(id){
  currentSessionId = id;
  renderSessions();
  updateChatHeader();
  if (!messages[id]) messages[id] = [];
  renderMessages(true);
  loadSessionHistory(id);
}

function updateChatHeader(){
  $('chatTitle').textContent = currentSessionId || '会话';
  $('chatSubtitle').textContent = currentSessionId ? `会话 ID: ${currentSessionId}` : '选择左侧会话或开始新会话';
}

async function loadSessionHistory(id){
  try{
    const r = await fetch(`${API_BASE}/api/sessions/${encodeURIComponent(id)}/history`);
    if (!r.ok) return;
    const j = await r.json();
    const raw = j.messages || [];

    // The backend persists messages using the OpenAI / Anthropic native
    // function-calling shape:
    //   * assistant.tool_calls = [{id, name, arguments}]
    //   * tool.tool_call_id    = "<id>", .tool_name, .content
    // We project this into the front-end's flat bubble list, routing
    // tool results to their bubble by id.
    const pending = {};   // call_id -> tool bubble
    const out = [];
    for (const msg of raw){
      const role = msg.role || '';
      if (role === 'system') continue;

      if (role === 'user'){
        out.push({ type:'user', content: msg.content || '' });
        continue;
      }

      if (role === 'tool'){
        const callId = msg.tool_call_id || '';
        const bubble = callId ? pending[callId] : null;
        if (bubble){
          bubble.result = msg.content || '';
        } else {
          out.push({
            type:'tool',
            callId,
            name: msg.tool_name || 'tool',
            args: '',
            result: msg.content || '',
            expanded: false,
          });
        }
        continue;
      }

      // assistant: may carry tool_calls, content text, or both.
      if (role === 'assistant'){
        const calls = Array.isArray(msg.tool_calls) ? msg.tool_calls : [];
        if (calls.length){
          for (const tc of calls){
            const bubble = {
              type:'tool',
              callId: tc.id || '',
              name: tc.name || 'tool',
              args: tc.arguments || '',
              result: null,
              expanded: false,
            };
            out.push(bubble);
            if (bubble.callId) pending[bubble.callId] = bubble;
          }
        }
        if (msg.content){
          out.push({ type:'assistant', content: msg.content });
        }
        continue;
      }
    }
    messages[id] = out;
    renderMessages(true);
  } catch(e){ console.error('loadSessionHistory failed', e); }
}

function renderMessages(scrollBottom){
  const c = $('messages'); c.innerHTML = '';
  if (!currentSessionId){
    c.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <div class="title">尚未选择会话</div>
      <div>点击侧边栏「新建会话」或在左侧列表中选一个</div>
    </div>`;
    return;
  }
  const list = messages[currentSessionId] || [];
  if (!list.length){
    c.innerHTML = `<div class="empty-state"><div class="title">开始对话</div><div>在下方输入消息发送给智能体</div></div>`;
    return;
  }
  list.forEach((m, i) => {
    const el = document.createElement('div');
    if (m.type === 'user'){
      el.className = 'chat-bubble user';
      el.innerHTML = `<div class="role">You</div><div class="content">${escapeHtml(m.content)}</div>`;
    } else if (m.type === 'assistant'){
      el.className = 'chat-bubble assistant';
      el.innerHTML = `<div class="role">Assistant</div><div class="content">${formatContent(m.content)}</div>`;
    } else if (m.type === 'tool'){
      el.className = 'chat-bubble tool' + (m.expanded ? ' open' : '');
      const argStr = m.args == null
        ? ''
        : (typeof m.args === 'string' ? m.args : JSON.stringify(m.args, null, 2));
      const argPreview = (typeof m.args === 'string' ? m.args : JSON.stringify(m.args || {})).slice(0, 120);
      const result = m.result;
      const resultStr = result == null
        ? '(waiting for response…)'
        : (typeof result === 'string' ? result : JSON.stringify(result, null, 2));
      const status = result == null ? 'running' : 'done';
      el.innerHTML = `
        <div class="tool-head" onclick="toggleTool(${i})">
          <span class="arrow">▶</span>
          <span class="tool-name">🛠 ${escapeHtml(m.name || 'tool')}</span>
          <span class="tool-args mono">${escapeHtml(argPreview)}</span>
          <span class="tool-status ${status}">${status === 'running' ? '…' : '✓'}</span>
        </div>
        <div class="tool-body">
          <div class="tool-sub-label">Input</div>
          <pre>${escapeHtml(argStr || '(none)')}</pre>
          <div class="tool-sub-label">Output</div>
          <pre>${escapeHtml(resultStr)}</pre>
        </div>`;
    } else if (m.type === 'status'){
      el.className = 'chat-bubble status' + (m.severity ? ' ' + m.severity : '') + (m.kind ? ' k-' + m.kind : '');
      el.textContent = m.content;
    } else if (m.type === 'ask_user'){
      el.className = 'chat-bubble ask-user';
      const rid = m.requestId || '';
      const answered = m.answered;
      let body = '';
      if (answered){
        body = `<div class="ask-question">${escapeHtml(m.question)}</div>
          <div class="ask-answered">已答复: ${escapeHtml(JSON.stringify(m.answer || ''))}</div>`;
      } else if (m.options && m.options.length){
        const btns = m.options.map((o, oi) =>
          `<button class="btn xs" onclick="submitAskUser('${rid}',{answers:['${escapeHtml(o)}']},this)">${escapeHtml(o)}</button>`
        ).join(' ');
        body = `<div class="ask-question">${escapeHtml(m.question)}</div>
          <div class="ask-options">${btns}</div>
          <div class="ask-free"><input type="text" id="ask_txt_${rid}" placeholder="或输入自定义文本">
          <button class="btn xs primary" onclick="const v=document.getElementById('ask_txt_${rid}').value;submitAskUser('${rid}',{text:v||''},this)">提交</button></div>`;
      } else {
        body = `<div class="ask-question">${escapeHtml(m.question)}</div>
          <div class="ask-free"><input type="text" id="ask_txt_${rid}" placeholder="输入答复 (60s 超时)">
          <button class="btn xs primary" onclick="const v=document.getElementById('ask_txt_${rid}').value;submitAskUser('${rid}',{text:v||''},this)">提交</button></div>`;
      }

    }
    c.appendChild(el);
  });

}

function toggleTool(idx){

function formatContent(text){
  if (text == null) return '';
  let s = escapeHtml(text).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  // Fenced code blocks ``` ... ```
  s = s.replace(/```([\s\S]*?)```/g, (_, code) => `<pre>${code}</pre>`);
  // Inline code `...`
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Newlines -> <br>
  s = s.replace(/\n/g, '<br>');
  return s;
}

function clearChat(){

function setStreaming(sessionId, streaming){

async function sendMessage(){
  const input = $('messageInput');
  const text = input.value.trim();
  if (!text) return;
  if (!currentSessionId){ await createSession(); }
  const sid = currentSessionId;
  if (!sid) return;

  messages[sid].push({ type:'user', content: text });

  input.value = ''; autoResize(input);
  setStreaming(sid, true);
  await streamChat(text, sid);
  setStreaming(sid, false);
}

async function streamChat(message, sessionId){
  // Old behaviour, restored: render structured events incrementally.
  //  * Natural-language stream chunks merge into the *last* assistant bubble
  //    (or push a new one if the previous bubble isn't an assistant). This
  //    yields the order: user → assistant-partial → tool → tool_response →
  //    assistant-partial → tool → ... → final-assistant.
  //  * If a `stream` chunk parses as a tool-call JSON (`{name, arguments}`)
  //    we treat it as a tool_call event for back-compat with older backends
  //    that only emit the tool call via `stream`.
  //  * `done` carries the authoritative final SessionInvokeResult. We don't
  //    push a separate bubble from it: the previously streamed assistant
  //    bubbles already contain the answer. We just surface errors.
  let receivedDone = false;
  try{
    const ctrl = new AbortController();
    lastStreamCancel = () => ctrl.abort();
    const r = await fetch(`${API_BASE}/api/chat/stream`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ session_id: sessionId, message }),
      signal: ctrl.signal
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    try {
      while (true){
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream:true });
        let dn;
        while ((dn = buf.indexOf('\n\n')) >= 0){
          const ev = buf.slice(0, dn); buf = buf.slice(dn + 2);
          const lines = ev.split('\n');
          let evt = 'message', dataLines = [];
          for (const l of lines){
            if (l.startsWith('event:')) evt = l.slice(6).trim();
            else if (l.startsWith('data:')) dataLines.push(l.slice(5).replace(/^ /, ''));
          }
          const data = dataLines.join('\n');
          handleSseEvent(sessionId, evt, data);
          if (evt === 'done') receivedDone = true;
        }
      }
    } catch (readErr) {
      // The server closes the chunked connection right after the `done`
      // event, which some browsers surface as "network error" on the next
      // read. Treat that as a clean end-of-stream.
      if (!receivedDone) throw readErr;
    }
  } catch(e){
    if (e.name !== 'AbortError' && !receivedDone){
      pushStatus(sessionId, '❌ ' + e.message, 'err');
    }
  } finally {
    lastStreamCancel = null;
  }
}

// === Helpers that append to messages[sessionId] in the OLD way ===

function appendAssistantChunk(sessionId, chunk){
  const list = messages[sessionId] || (messages[sessionId] = []);
  const last = list[list.length - 1];
  // Merge into the previous assistant bubble if and only if it's still the
  // most recent message. A tool or status bubble in between breaks the merge
  // → next stream chunk starts a fresh assistant bubble.
  if (last && last.type === 'assistant'){
    last.content = (last.content || '') + chunk;
  } else {
    list.push({ type:'assistant', content: chunk });
  }
  if (currentSessionId === sessionId) renderMessages(true);
}

function appendToolCall(sessionId, name, args, callId){
  const list = messages[sessionId] || (messages[sessionId] = []);

  // The backend emits the model's raw tokens via `stream` events AND a
  // separate `tool_call` event for the same call. The raw tokens include
  // the tool-call JSON (`{"name":"...","arguments":...}`), which would
  // otherwise show up inside the previous assistant bubble. Strip the
  // trailing JSON object (or the whole bubble if it was JSON-only) before
  // pushing the tool card.
  cleanTrailingToolJson(list, name);

  list.push({
    type:'tool',
    callId: callId || '',
    name: name || 'tool',
    args: args,
    result: null,
    expanded: false,
  });
  if (currentSessionId === sessionId) renderMessages(true);
}

// Strip a trailing JSON tool-call from the last assistant bubble. Looks for
// the last balanced `{...}` whose first key is "name" — if it exists, cut
// from there onwards. If the bubble becomes empty/whitespace, drop it.
function cleanTrailingToolJson(list, expectedName){
  for (let i = list.length - 1; i >= 0; i--){
    const m = list[i];
    if (m.type === 'tool' || m.type === 'status') return; // nothing to clean
    if (m.type !== 'assistant') continue;
    const cut = findToolJsonStart(m.content || '', expectedName);
    if (cut >= 0){
      m.content = (m.content || '').slice(0, cut).trim();
      if (!m.content) list.splice(i, 1);
    }
    return;
  }
}

// Returns the index in `text` of the '{' that opens a trailing JSON tool
// call (`{"name": ..., "arguments": ...}`), or -1 if none. Scans from the
// end looking for the last '{', then validates the surrounding shape.
function findToolJsonStart(text, expectedName){
  // Quick exit: must contain a brace
  let lastBrace = text.lastIndexOf('{');
  while (lastBrace !== -1){
    const tail = text.slice(lastBrace).trim();
    // Heuristic: trailing JSON should mention "name"
    if (/"name"\s*:/.test(tail) && /"arguments"\s*:/.test(tail)){
      // Try to parse the tail as JSON or as a sequence of concatenated JSONs.
      try{
        JSON.parse(tail);
        return lastBrace;
      } catch(e){
        // Tail might be incomplete (mid-stream) or have multiple objects.
        // Accept as a tool-call boundary if the first balanced object
        // starting at lastBrace parses and mentions the expected name.
        const balanced = takeBalancedJson(text, lastBrace);
        if (balanced != null){
          try{
            const obj = JSON.parse(balanced);
            if (obj && obj.name && (!expectedName || obj.name === expectedName)){
              return lastBrace;
            }
          } catch(e2) {}
        }
      }
      // Otherwise back off to an earlier '{' (handles concatenated tool calls)
      lastBrace = text.lastIndexOf('{', lastBrace - 1);
      continue;
    }
    lastBrace = text.lastIndexOf('{', lastBrace - 1);
  }
  return -1;
}

// Extract the first balanced {...} starting at `start`. Returns null if not balanced.
function takeBalancedJson(s, start){
  let depth = 0, inStr = false, esc = false;
  for (let i = start; i < s.length; i++){
    const ch = s[i];
    if (inStr){
      if (esc) esc = false;
      else if (ch === '\\') esc = true;
      else if (ch === '"') inStr = false;
      continue;
    }
    if (ch === '"') { inStr = true; continue; }
    if (ch === '{') depth++;
    else if (ch === '}'){
      depth--;
      if (depth === 0) return s.slice(start, i + 1);
    }
  }
  return null;
}

function setLastToolResult(sessionId, result, callId){
  const list = messages[sessionId] || [];
  // Prefer matching by call_id (native function-calling); fall back to
  // "the most recent unfinished tool bubble" for legacy/fallback paths.
  if (callId){
    for (let i = list.length - 1; i >= 0; i--){
      if (list[i].type === 'tool' && list[i].callId === callId){
        list[i].result = result;
        if (currentSessionId === sessionId) renderMessages(true);
        return;
      }
    }
  }
  for (let i = list.length - 1; i >= 0; i--){
    if (list[i].type === 'tool' && list[i].result == null){
      list[i].result = result;
      break;
    }
  }
  if (currentSessionId === sessionId) renderMessages(true);
}

function pushStatus(sessionId, content, severity){
  const list = messages[sessionId] || (messages[sessionId] = []);
  const t = (content || '').trim();
  if (!t) return;
  // Recognise iteration headers as accent chips, errors/cancel as warn/err.
  let kind = null, sev = severity || null;
  if (/^Thinking\.\.\./i.test(t)) kind = 'iter';
  else if (!sev && /Cancelled|Max iterations|empty response/i.test(t)) sev = 'warn';
  list.push({ type:'status', content: t, kind, severity: sev });
  if (currentSessionId === sessionId) renderMessages(true);
}

function renderAskUser(sessionId, data){
  let payload = {};
  try{ payload = JSON.parse(data) || {}; } catch(e){ payload = {}; }
  const list = messages[sessionId] || (messages[sessionId] = []);
  list.push({
    type: 'ask_user',
    requestId: payload.request_id || '',
    question: payload.question || '',
    options: Array.isArray(payload.options) ? payload.options : [],
    multiple: !!payload.multiple,
    header: payload.header || '',
    timeoutSec: payload.timeout_seconds || 60,
    answered: false,
  });
  if (currentSessionId === sessionId) renderMessages(true);
}

async function submitAskUser(requestId, answerObj, btnEl){
  if (btnEl) btnEl.disabled = true;
  try{
    const resp = await fetch(`${API_BASE}/api/answer`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ request_id: requestId, answer: JSON.stringify(answerObj) }),
    });
    const j = await resp.json().catch(()=>null);
    // Mark the matching ask_user bubble as answered so it is locked.
    Object.values(messages).forEach(list => {
      list.forEach(m => {
        if (m.type === 'ask_user' && m.requestId === requestId){
          m.answered = true;
          m.answer = answerObj;
        }
      });
    });
    if (currentSessionId) renderMessages(false);
    if (!j || j.ok === false){
      flashStatus('提交答复失败' + (j && j.error ? (': ' + j.error) : ''));
    }
  } catch(e){
    if (btnEl) btnEl.disabled = false;

function handleSseEvent(sessionId, evt, data){
  if (!messages[sessionId]) messages[sessionId] = [];

  if (evt === 'stream'){
    try{
      data = JSON.parse(data);
    } catch(e) {}
    // Heuristic: if the chunk looks like a complete tool-call JSON object,
    // promote it to a tool card so legacy backends still work. Modern
    // backends will also emit a separate 'tool_call' event; our list_row
    // logic harmlessly absorbs duplicates because the second will create a
    // new (empty) tool card. To avoid that we ONLY auto-promote when no
    // explicit tool_call event has fired for this exact payload — but since
    // we can't know that here cheaply, we keep the old behaviour: only
    // promote when the chunk *starts* with '{' and parses cleanly.
    const trimmed = data.trim();
    if (trimmed.startsWith('{')){
      try{
        const parsed = JSON.parse(trimmed);
        if (parsed && parsed.name && parsed.arguments !== undefined){
          const args = typeof parsed.arguments === 'string'
            ? parsed.arguments
            : JSON.stringify(parsed.arguments);
          appendToolCall(sessionId, parsed.name, args);
          return;
        }
      } catch(e) { /* fall through – treat as plain text */ }
    }
    appendAssistantChunk(sessionId, data);
    return;
  }
  if (evt === 'status'){
    pushStatus(sessionId, data);
    return;
  }
  if (evt === 'tool_call'){
    let name = 'tool', args = data, callId = '';
    try{
      const parsed = JSON.parse(data);
      if (parsed){
        name = parsed.name || name;
        callId = parsed.id || '';
        args = typeof parsed.arguments === 'string'
          ? parsed.arguments
          : (parsed.arguments !== undefined ? JSON.stringify(parsed.arguments) : data);
      }
    } catch(e) {}
    appendToolCall(sessionId, name, args, callId);
    return;
  }
  if (evt === 'tool_response'){
    // Native function-calling backend prefixes the response with the call
    // id ("call_<sid>_<n>: <result>") so we can route it to the right
    // bubble. If no prefix is present we fall back to "last unfinished".
    let callId = '';
    let payload = data;
    const m = data.match(/^([A-Za-z0-9_\-]+):\s*([\s\S]*)$/);
    if (m){
      callId = m[1];
      payload = m[2];
    }
    setLastToolResult(sessionId, payload, callId);
    return;
  }
  if (evt === 'ask_user'){
    renderAskUser(sessionId, data);
    return;
  }
  if (evt === 'done'){
    try{
      const res = JSON.parse(data);
      if (res && res.success === false && res.error){
        pushStatus(sessionId, 'Error: ' + res.error, 'err');
      } else if (res && res.success !== false && res.content){
        const list = messages[sessionId] || [];
        const last = list[list.length - 1];
        if (!last || last.type !== 'assistant'){
          appendAssistantChunk(sessionId, res.content);
        }
      }
    } catch(e) {}
    return;
  }
}

  });

  root.querySelectorAll('[data-ek]').forEach(el=>{el.oninput=()=>{rows[+el.dataset.ek].key=el.value;};});
  root.querySelectorAll('[data-et]').forEach(el=>{el.onchange=()=>{const i=+el.dataset.et;rows[i].type=el.value;if(el.value==='bool')rows[i].value=!!rows[i].value;else if(el.value==='int')rows[i].value=parseInt(rows[i].value)||0;else if(el.value==='float')rows[i].value=Number(rows[i].value)||0;else rows[i].value=String(rows[i].value==null?'':rows[i].value);renderEpTable();};});
  root.querySelectorAll('[data-ev]').forEach(el=>{el.oninput=el.onchange=()=>{const i=+el.dataset.ev,t=rows[i].type;if(t==='bool')rows[i].value=el.checked;else if(t==='int')rows[i].value=parseInt(el.value)||0;else if(t==='float')rows[i].value=Number(el.value)||0;else rows[i].value=el.value;};});
  root.querySelectorAll('[data-ed]').forEach(el=>{el.onclick=()=>{rows.splice(+el.dataset.ed,1);renderEpTable();};});

function vstr(id){const e=$(id);return e?e.value:'';}
function vnum(id,def){const x=parseInt(vstr(id));return Number.isFinite(x)?x:(def||0);}
function vbool(id){const e=$(id);return e?!!e.checked:false;}

function buildAgentFromForm(){
  const ep={};
  epRows().forEach(r=>{if(!r.key)return;if(r.type==='bool')ep[r.key]=!!r.value;else if(r.type==='int')ep[r.key]=parseInt(r.value)||0;else if(r.type==='float')ep[r.key]=Number(r.value)||0;else ep[r.key]=String(r.value==null?'':r.value);});
  const cur=currentAgentDraft||{};
  // Persist only fields editable in this Web UI. Everything else (tools,
  // prompts, context, dream, data paths, concurrency, etc.) comes from the
  // code default and is merged server-side by AgentConfigStore.
  return {
    id: cur.id,
    modelConfig:{
      baseUrl: vstr('ag_m_baseUrl'),
      apiKey: vstr('ag_m_apiKey'),
      modelName: vstr('ag_m_modelName'),
      provider: vstr('ag_m_provider'),
      formatType: vstr('ag_m_formatType'),
      extraParams: ep
    },
    mcpServerIds: [...(selMcp() || [])]
  };
}

async function saveCurrentChannel(){
  const isNew=selectedChannelId&&selectedChannelId.startsWith('new:');
  const type=isNew?selectedChannelId.split(':')[1]:(channelsCache.find(c=>c.id===selectedChannelId)||{}).type;
  if(!type)return alert('无法确定频道类型');
  if(type==='feishu'){
    const name=$('chName').value.trim();
    const appId=$('chAppId').value.trim();
    const appSecret=$('chAppSecret').value.trim();
    const enabled=$('chEnabled').checked;
    if(!appId||!appSecret)return alert('App ID 和 App Secret 必填');
    const payload={type:'feishu',name:name||`Feishu ${appId.slice(-4)}`,enabled,params:{appId,appSecret}};
    try{
      if(isNew){
        const r=await fetch(`${API_BASE}/api/channels`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        const j=await r.json();
        selectedChannelId=j.id||null;
      }else{
        await fetch(`${API_BASE}/api/channels/${encodeURIComponent(selectedChannelId)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      }
      await refreshChannelTree();
      if(selectedChannelId)selectChannel(selectedChannelId);
      flashStatus('频道已保存');
    }catch(e){alert('保存失败: '+e);}
  }
}

async function deleteCurrentChannel(){
  if(!selectedChannelId||selectedChannelId.startsWith('new:'))return;
  const ch=channelsCache.find(c=>c.id===selectedChannelId);
  if(!confirm(`删除频道 "${ch?(ch.name||ch.id):selectedChannelId}"?`))return;
  try{
    await fetch(`${API_BASE}/api/channels/${encodeURIComponent(selectedChannelId)}`,{method:'DELETE'});
    selectedChannelId=null;
    await refreshChannelTree();
    showChannelEmpty('已删除');
  }catch(e){alert('删除失败: '+e);}
}

  $('mcpCount').textContent=mcpServersCache.length+' servers';
  $('navMcpCount').textContent=mcpServersCache.length||'';
  const root=$('mcpList');root.innerHTML='';
  if(!mcpServersCache.length){
    root.innerHTML='<div class="empty-state"><div class="title">暂无 MCP 服务</div><div>点击「+ 新增」创建或编辑 agents.json</div></div>';
    return;
  }
  mcpServersCache.forEach(srv=>{
    const row=document.createElement('button');
    let dotCls='status-dot ';
    if(!srv.enabled){dotCls+='disabled';}
    else if(srv.connected){dotCls+='connected';}
    else{dotCls+='disconnected';}
    row.className=`list-row${selectedMcpServerId===srv.id?' active':''}`;
    row.innerHTML=`
      <span class="${dotCls}" title="${!srv.enabled?'已禁用':srv.connected?'已连接':'连接失败'}"></span>
      <div class="lr-main">
        <span class="pill accent">${escapeHtml(srv.type||'')}</span>
        <span class="lr-title">${escapeHtml(srv.name||srv.id)}</span>
        <span class="lr-id">${escapeHtml(srv.id||'')}</span>
      </div>
      <span class="pill ${srv.enabled?'ok':'danger'}">${srv.enabled?'enabled':'disabled'}</span>`;
    row.onclick=()=>selectMcpServer(srv.id);
    root.appendChild(row);
  });
}
function selectMcpServer(id){
  selectedMcpServerId=id;
  refreshMcpList();
  const srv=mcpServersCache.find(c=>c.id===id);
  if(!srv){showMcpEmpty();return;}
  renderMcpEditor(srv);
}
function startNewMcpServer(){
  selectedMcpServerId='new';
  refreshMcpList();
  renderMcpEditor({id:'',name:'',description:'',enabled:true,type:'streamable-http-client',url:'',endpoint:'',command:'',args:[],env:{},headers:{},_isNew:true,connected:false});
}
function showMcpEmpty(msg){
  $('mcpDetailTitle').textContent='MCP 服务';
  $('mcpDetailSub').textContent='';
  $('mcpDetailActions').style.display='none';
  $('mcpDetailBody').innerHTML='<div class="empty-state"><div class="title">'+escapeHtml(msg||'在左侧选择服务或点击「+ 新增」')+'</div></div>';
}
function dotClassFor(srv){
  if(!srv.enabled)return'status-dot disabled';
  return srv.connected?'status-dot connected':'status-dot disconnected';
}
function collectKvRows(containerId){
  const rows=document.querySelectorAll(`#${containerId} .kv-row`);
  const obj={};
  rows.forEach(r=>{
    const k=r.querySelector('.kv-k');const v=r.querySelector('.kv-v');
    if(k&&v&&k.value.trim()){obj[k.value.trim()]=v.value;}
  });
  return obj;
}
function addKvRow(containerId,k,v){
  const el=$(containerId);if(!el)return;
  const d=document.createElement('div');d.className='kv-row';
  d.innerHTML=`<input class="kv-k" placeholder="key" value="${escapeHtml(k||'')}"><input class="kv-v" placeholder="value" value="${escapeHtml(v||'')}"><button type="button" class="btn xs danger" onclick="removeKvRow(this)">−</button>`;
  el.appendChild(d);
}
function removeKvRow(btn){
  btn.parentElement.remove();
}
function renderKvRows(containerId,obj){
  const el=$(containerId);if(!el)return;
  el.innerHTML='';
  const keys=Object.keys(obj||{});
  if(!keys.length){el.innerHTML='<div class="kv-empty">暂无条目</div>';return;}
  keys.forEach(k=>addKvRow(containerId,k,obj[k]));
}
function renderMcpEditor(srv){
  const isNew=!!srv._isNew;
  const type=srv.type||'streamable-http-client';
  $('mcpDetailTitle').textContent=isNew?'新建 MCP 服务':(srv.name||srv.id);
  $('mcpDetailSub').innerHTML=isNew?'选择传输类型开始配置':`ID: <span class="mono">${escapeHtml(srv.id)}</span> · ${dotClassFor(srv).replace('status-dot ','').replace('connected','已连接').replace('disconnected','未连接').replace('disabled','已禁用')}`;
  $('mcpDetailActions').style.display='flex';
  $('mcpDeleteBtn').style.display=isNew?'none':'inline-flex';
  const body=$('mcpDetailBody');
  body.innerHTML=`
    <div class="field"><label>ID${isNew?' *':' (只读)'}</label><input type="text" id="mcpId" value="${escapeHtml(srv.id||'')}" ${isNew?'':'disabled'} placeholder="my-server"></div>
    <div class="field"><label>名称</label><input type="text" id="mcpName" value="${escapeHtml(srv.name||'')}" placeholder="My MCP Server"></div>
    <div class="field"><label>描述</label><textarea id="mcpDesc" rows="2" placeholder="MCP 服务器描述">${escapeHtml(srv.description||'')}</textarea></div>
    <div class="field checkbox-field"><input type="checkbox" id="mcpEnabled" ${srv.enabled!==false?'checked':''}><label for="mcpEnabled">启用（保存后立即连接）</label></div>
    <div class="field"><label>传输类型</label><select id="mcpType" onchange="onMcpTypeChange()"><option value="streamable-http-client"${type==='streamable-http-client'?' selected':''}>Streamable HTTP</option><option value="sse"${type==='sse'?' selected':''}>SSE</option><option value="stdio"${type==='stdio'?' selected':''}>STDIO</option></select></div>
    <div id="mcpTypeFields"></div>
    <div style="margin-top:8px;" id="mcpSaveStatus"></div>`;
  // Set global helper refs for the save function
  window._mcpEditorCtx=srv;
  renderMcpTypeFields(type,srv);
}
function renderMcpTypeFields(type,srv){
  const root=$('mcpTypeFields');if(!root)return;
  const stp=$('mcpSaveStatus');
  if(stp){stp.innerHTML='<div id="mcpTempStatus" class="form-status"></div>';}
  if(type==='stdio'){
    root.innerHTML=`
      <div class="field"><label>Command *</label><input type="text" id="mcpCommand" value="${escapeHtml(srv.command||'')}" placeholder="npx @modelcontextprotocol/server-xxx"></div>
      <div class="field"><label>Args（每行一个）</label><textarea id="mcpArgs" rows="3" placeholder="--port 3000">${escapeHtml((srv.args||[]).join('\n'))}</textarea></div>
      <div class="field"><label>环境变量</label><div class="kv-list" id="mcpEnv"></div><button type="button" class="btn xs" onclick="addKvRow('mcpEnv')">+ 添加</button></div>`;
    renderKvRows('mcpEnv',srv.env||{});
  }else{
    root.innerHTML=`
      <div class="field"><label>URL</label><input type="text" id="mcpUrl" value="${escapeHtml(srv.url||'')}" placeholder="https://mcp.example.com"></div>
      <div class="field"><label>Endpoint</label><input type="text" id="mcpEndpoint" value="${escapeHtml(srv.endpoint||'')}" placeholder="/mcp"></div>
      <div class="field"><label>Headers</label><div class="kv-list" id="mcpHeaders"></div><button type="button" class="btn xs" onclick="addKvRow('mcpHeaders')">+ 添加</button></div>`;
    renderKvHeaders('mcpHeaders',srv.headers||{});
  }
}
function onMcpTypeChange(){
  const type=$('mcpType').value;
  const srv=window._mcpEditorCtx||{};
  renderMcpTypeFields(type,srv);
}
function collectMcpForm(){
  const id=$('mcpId').value.trim();
  const name=$('mcpName').value.trim();
  const desc=$('mcpDesc').value.trim();
  const enabled=$('mcpEnabled').checked;
  const type=$('mcpType').value;
  let url='',endpoint='',command='',args=[],env={},headers={};
  if(type==='stdio'){
    command=$('mcpCommand').value.trim();
    const argsText=$('mcpArgs').value.trim();
    args=argsText?argsText.split('\n').filter(a=>a.trim()):[];
    env=collectKvRows('mcpEnv'||'');
    if(!command){$('mcpTempStatus')&&( $('mcpTempStatus').textContent='Command 必填', $('mcpTempStatus').className='form-status err');return null;}
  }else{
    url=$('mcpUrl').value.trim();
    endpoint=$('mcpEndpoint').value.trim();
    headers=collectHeaders('mcpHeaders'||'');
    if(!url&&!endpoint){$('mcpTempStatus')&&( $('mcpTempStatus').textContent='URL 或 Endpoint 至少填一个', $('mcpTempStatus').className='form-status err');return null;}
  }
  return{id,name,description:desc,enabled,type,url,endpoint,command,args,env,headers};
}
function collectHeaders(containerId){
  return collectKvRows(containerId);
}
function renderKvHeaders(cid,obj){renderKvRows(cid,obj);}
async function waitForMcpStatus(id, expectedConnected){
  for(let i=0;i<5;i++){
    await new Promise(resolve=>setTimeout(resolve, i===0?300:1000));
    await refreshMcpList();
    const srv=mcpServersCache.find(s=>s.id===id);
    if(!srv){return;}
    if(!srv.enabled || srv.connected===expectedConnected){
      selectMcpServer(id);
      return;
    }
  }
  selectMcpServer(id);
}

async function saveCurrentMcpServer(){
  const payload=collectMcpForm();
  if(!payload)return;
  const isNew=selectedMcpServerId==='new';
  try{
    if(isNew){
      const r=await fetch(`${API_BASE}/api/mcp_servers`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      const j=await r.json();
      if(!r.ok){alert('创建失败: '+(j.error||r.status));return;}
      selectedMcpServerId=j.id;
    }else{
      const r=await fetch(`${API_BASE}/api/mcp_servers/${encodeURIComponent(selectedMcpServerId)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(!r.ok){const j=await r.json();alert('更新失败: '+(j.error||r.status));return;}
    }
    await refreshMcpList();
    selectMcpServer(selectedMcpServerId);
    flashStatus('MCP 服务已保存，正在刷新连接状态');
    if(payload.enabled){
      waitForMcpStatus(selectedMcpServerId,true);
    }
  }catch(e){alert('保存失败: '+e);}
}
async function deleteCurrentMcpServer(){
  if(!selectedMcpServerId||selectedMcpServerId==='new')return;
  const srv=mcpServersCache.find(c=>c.id===selectedMcpServerId);
  if(!confirm(`删除 MCP 服务 "${srv?(srv.name||srv.id):selectedMcpServerId}"?`))return;
  try{
    await fetch(`${API_BASE}/api/mcp_servers/${encodeURIComponent(selectedMcpServerId)}`,{method:'DELETE'});
    selectedMcpServerId=null;
    await refreshMcpList();
    showMcpEmpty('已删除');
  }catch(e){alert('删除失败: '+e);}
}

// ============================================================
//  Health / init
// ============================================================
async function checkHealth(){
  try{
    const r=await fetch(`${API_BASE}/api/health`);
    if(r.ok){setStatus('connected');}
    else setStatus('error');
  }catch(e){setStatus('offline');}
}

async function init(){
  await checkHealth();
  await fetchSessions();
  // Pre-fetch counts for sidebar meta badges
  refreshAgentList();
  refreshSkillList();
  refreshChannelTree();
  refreshMcpList();
  // Restore last session
  const last=localStorage.getItem('jiuwen_session_id');
  if(last && sessions.some(s=>s.id===last))switchSession(last);
  else if(sessions.length)switchSession(sessions[0].id);
  setInterval(fetchSessions, 5000);
}

window.switchView = switchView;
window.createSession = createSession;
window.deleteSession = deleteSession;
window.switchSession = switchSession;
window.sendMessage = sendMessage;
window.cancelRequest = cancelRequest;
window.clearChat = clearChat;
window.handleKeyDown = handleKeyDown;
window.autoResize = autoResize;
window.toggleTool = toggleTool;
window.refreshAgentList = refreshAgentList;
window.selectAgent = selectAgent;
window.saveAgentForm = saveAgentForm;
window.revertAgentForm = revertAgentForm;
window.reloadAgentsFromFile = reloadAgentsFromFile;
window.reloadAllFromFile = reloadAllFromFile;
window.togglePw = togglePw;
window.addEpRow = addEpRow;
window.addPpRow = addPpRow;
window.refreshChannelTree = refreshChannelTree;
window.startNewChannel = startNewChannel;
window.saveCurrentChannel = saveCurrentChannel;
window.deleteCurrentChannel = deleteCurrentChannel;
window.refreshMcpList = refreshMcpList;
window.selectMcpServer = selectMcpServer;
window.startNewMcpServer = startNewMcpServer;
window.saveCurrentMcpServer = saveCurrentMcpServer;
window.deleteCurrentMcpServer = deleteCurrentMcpServer;
window.onMcpTypeChange = onMcpTypeChange;
window.addKvRow = addKvRow;
window.removeKvRow = removeKvRow;
window.fetchSessions = fetchSessions;
window.refreshSkillList = refreshSkillList;
window.selectSkill = selectSkill;

document.addEventListener('DOMContentLoaded', init);
if(document.readyState !== 'loading') init();



</script>
