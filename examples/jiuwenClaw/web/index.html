                        <input id="chAppId" value="${escapeHtml(params.appId || '')}" placeholder="cli_xxxxxxxxxx">
                    </div>
                    <div class="field">
                        <label>App Secret *</label>
                        <div class="input-with-toggle">
                            <input id="chAppSecret" type="password" value="${escapeHtml(params.appSecret || '')}" placeholder="your secret">
                            <button type="button" class="input-toggle-btn" id="chAppSecretToggle" onclick="toggleSecretVisibility('chAppSecret', 'chAppSecretToggle')">Show</button>
                        </div>
                        <div class="hint">Stored as-is on the server.</div>
                    </div>
                    <div class="field">
                        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
                            <input type="checkbox" id="chEnabled" ${ch.enabled !== false ? 'checked' : ''} style="width:auto">
                            <span>Enabled (connects on save)</span>
                        </label>
                    </div>
                    <div class="channel-detail-actions">
                        <button class="btn btn-primary" id="chSaveBtn">${isNew ? 'Create' : 'Save'}</button>
                        ${isNew ? '' : '<button class="btn-danger-solid" id="chDeleteBtn">Delete</button>'}
                    </div>
                `;
                body.querySelector('#chSaveBtn').onclick = () => saveCurrentChannel();
                if (!isNew) {
                    body.querySelector('#chDeleteBtn').onclick = () => deleteCurrentChannel();
                }
            } else {
                body.innerHTML = `
                    <div class="channel-detail-empty">
                        ${escapeHtml(capitalize(type))} channel editor is not implemented yet.
                    </div>
                `;
            }
        }

        async function saveCurrentChannel() {
            const isNew = selectedChannelId && selectedChannelId.startsWith('new:');
            const type = isNew ? selectedChannelId.split(':')[1] : (channelsCache.find(c => c.id === selectedChannelId) || {}).type;
            if (!type) {
                alert('Cannot determine channel type.');
                return;
            }

            if (type === 'feishu') {
                const name = document.getElementById('chName').value.trim();
                const appId = document.getElementById('chAppId').value.trim();
                const appSecret = document.getElementById('chAppSecret').value.trim();
                const enabled = document.getElementById('chEnabled').checked;

                if (!appId || !appSecret) {
                    alert('App ID and App Secret are required.');
                    return;
                }

                const payload = {
                    type: 'feishu',
                    name: name || `Feishu ${appId.slice(-4)}`,
                    enabled,
                    params: { appId, appSecret }
                };

                if (isNew) {
                    const result = await createChannel(payload.type, payload.name, payload.params);
                    if (!result) {
                        alert('Create failed.');
                        return;
                    }
                    selectedChannelId = result.id || null;
                    await refreshChannelTree();
                    if (selectedChannelId) {
                        selectChannel(selectedChannelId);
                    }
                } else {
                    const ok = await updateChannel(selectedChannelId, payload);
                    if (!ok) {
                        alert('Save failed.');
                        return;
                    }
                    await refreshChannelTree();
                    selectChannel(selectedChannelId);
                }
            }
        }

        async function deleteCurrentChannel() {
            if (!selectedChannelId || selectedChannelId.startsWith('new:')) return;
            const ch = channelsCache.find(c => c.id === selectedChannelId);
            const name = ch ? (ch.name || ch.id) : selectedChannelId;
            if (!confirm(`Delete channel "${name}"? This cannot be undone.`)) return;

            const ok = await deleteChannel(selectedChannelId);
            if (!ok) {
                alert('Delete failed.');
                return;
            }
            selectedChannelId = null;
            await refreshChannelTree();
            showChannelEmpty('Channel deleted.');
        }

        function capitalize(s) {
            if (!s) return '';
            return s.charAt(0).toUpperCase() + s.slice(1);
        }

        function toggleSecretVisibility(inputId, btnId) {
            const input = document.getElementById(inputId);
            const btn = document.getElementById(btnId);
            if (!input || !btn) return;
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'Hide';
            } else {
                input.type = 'password';
                btn.textContent = 'Show';
            }
        }

        // Expose
        window.switchNavView = switchNavView;
        window.toggleSecretVisibility = toggleSecretVisibility;

        // ==================== End Channels ====================

        // Initialize
        async function init() {
            await checkHealth();
            await fetchSessions();
            
            // Restore last active session
            const lastSession = localStorage.getItem('jiuwen_session_id');
            if (lastSession && sessions.some(s => s.id === lastSession)) {
                switchSession(lastSession);
            } else if (sessions.length > 0) {
                switchSession(sessions[0].id);
            } else {
                await createSession();
            }
        }

        init();
    </script>
</body>
</html>
